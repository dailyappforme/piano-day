        <div class="menu" role="menu">${Object.entries(labels).map(([k,l])=>`<button type="button" class="menu-item${k===state.sort?' is-selected':''}" role="menuitem" data-sortopt="${k}">${t(l)}</button>`).join("")}</div>
      </div>`;
}
// Size the mobile sort menu to the space above the tab bar; flip up if there's more room above.
function fitSortMenu(dd){
  const menu = dd.querySelector('.menu'); if (!menu) return;
  menu.style.top = ''; menu.style.bottom = ''; menu.style.maxHeight = '';
  const r = dd.getBoundingClientRect();
  const tb = document.querySelector('.tabbar');
  const floor = tb ? tb.getBoundingClientRect().top : window.innerHeight;
  const below = floor - r.bottom - 12;
  const above = r.top - 12;
  if (below < 180 && above > below) {         // not enough room below → drop up
    menu.style.top = 'auto'; menu.style.bottom = 'calc(100% + 6px)';
    menu.style.maxHeight = Math.max(140, above) + 'px';
  } else {
    menu.style.maxHeight = Math.max(140, below) + 'px';
  }
}
// shared: wire a sort bar's dir button + chips to a state object + rerender callback.
// Any change rebuilds the bar HTML in place (keeps chip labels / level-board in sync).
function wireSortBar(container, state, rerender, labels) {
  labels = labels || SORT_LABELS;
  const rebuild = ()=>{ container.innerHTML = sortBarHTML(state, null, labels); };
  container.addEventListener("click", e=>{
    const dirBtn = e.target.closest('[data-role="dir"]');
    if (dirBtn) { state.dir = state.dir==="asc" ? "desc" : "asc"; rebuild(); rerender(); return; }
    // mobile sort dropdown: trigger toggles menu
    const trig = e.target.closest('[data-role="sorttrigger"]');
    if (trig) { e.stopPropagation(); const dd=trig.closest('.sort-dd'); const open=dd.classList.toggle('is-open'); trig.setAttribute('aria-expanded', open); if (open) fitSortMenu(dd); return; }
    // mobile sort dropdown: menu item selects a sort key
    const opt = e.target.closest('[data-sortopt]');
    if (opt) { state.sort = opt.dataset.sortopt; rebuild(); rerender(); return; }
    const b = e.target.closest("button[data-sort]"); if (!b) return;
    state.sort = b.dataset.sort; rebuild(); rerender();
  });
  document.addEventListener("click", e=>{ container.querySelectorAll('.dropdown.is-open').forEach(dd=>{ if(!dd.contains(e.target)) dd.classList.remove('is-open'); }); });
}
function renderPieceList() {
  const { id, sort, tonality, q, dir } = pianistState;
  let list = piecesOf(id);
  if (tonality !== "all") list = list.filter(p => modeOf(p) === tonality);

  const wrap = document.getElementById("pieceListWrap");
  if (!list.length) { wrap.innerHTML = `<div class="empty"><div class="empty-title">Nothing in this filter</div></div>`; return; }
  renderGroups(wrap, groupPieces(list, sort), sort, dir);
}
function pieceRowWithSort(p, idx, sort) {
  const pct = pctOf(p.id);
  // right-side tag reflects the current sort dimension
  let tag;
  if (sort === "year") tag = p.year;
  else if (sort === "length") tag = fmtDur(p.dur);
  else if (sort === "key") tag = fmtKey(p.key);
  else tag = gradeShort(p.level, null, p.id);   // name, level, coll — grade in the chosen board
  return `<div class="prow" data-piece="${p.id}">
    <div class="prow-body">
      <div class="prow-title">${sort==='coll'?movementLabel(p):pieceNameHTML(p)}${m2badge(p)}</div>
      <div class="prow-meta"><span>${p.year}</span><span class="dot-sep">${fmtDur(p.dur)}</span><span class="dot-sep">${fmtKey(p.key)}</span>${(gr=>gr?`<span class="dot-sep">${gr}</span>`:"")(gradeShort(p.level, null, p.id))}</div>
    </div>
    <div class="prow-right">
      ${(sort==='coll'||sort==='name'||sort==='composer'||sort==='dateAdded')?"":`<span class="lvpill">${tag}</span>`}
      ${pct>0?`<span class="prow-pct">${pct}%</span>`:""}
    </div>
  </div>`;
}

function renderSheet() {

  const hasWarmup = warmupItems(p).length > 0;   // keyless pieces (whole-tone/no key) have none → hide the tab
  if (sheetCtx.tab === "practice" && !hasWarmup) sheetCtx.tab = "focus";
  const TABS = [["focus",t("Score")], ...(hasWarmup ? [["practice",t("Warm-Up")]] : []), ["explore",t("Explore")]];
  v.innerHTML = `
    <div class="appbar">
      <button class="appbar-back" id="sBack">${IC.back}</button>

    </div></div>

    <div id="sheetPane"></div>`;

  // common wiring (persists across tab switches)
  v.querySelector("#sBack").addEventListener("click", ()=>{ stopAllPractice(); backFromSheet(); });
  const markBtn = v.querySelector("#markBtn");
  const toggleMark = ()=>{
    const willSave = !S.saved.includes(p.id);
    document.querySelectorAll("#markBtn,#fMark").forEach(b=>b.classList.toggle("is-marked", willSave));  // instant feedback first
    const i=S.saved.indexOf(p.id);
    if(i>=0){S.saved.splice(i,1); track("piece_unsave",{id:p.id});} else {S.saved.unshift(p.id); track("piece_save",{id:p.id, title:p.title, composer:p.c});}
    save();
  };
  markBtn.addEventListener("click", toggleMark);
  const hdrPlay = v.querySelector("#hdrPlay");
  if (hdrPlay) hdrPlay.addEventListener("click", ()=>togglePlay(p.id));
  v.querySelector("#sheetSeg").addEventListener("click", e=>{
    const b=e.target.closest("button[data-stab]"); if(!b || b.dataset.stab===sheetCtx.tab) return;
    stopAllPractice();

    v.querySelectorAll("#sheetSeg button").forEach(x=>x.classList.toggle("is-active", x.dataset.stab===sheetCtx.tab));
    renderSheetPane(p, toggleMark);
  });
  renderSheetPane(p, toggleMark);
}

function scoreEl(p, variant){
  const h = variant==="focus" ? "min-height:60vh" : "height:300px";
  const osmdTitle = variant==='focus' ? `<div class="osmd-title"><span class="osmd-title-name">${pieceNameHTML(p)}</span><span class="osmd-title-by">${COMPOSERS[p.c].name}</span></div>` : "";
  // PD scans normally print their own title+composer → don't add ours (avoid duplicate).
  // Only these collections use a typeset that shows just "No. N" and needs our title header.
  const SCAN_NO_TITLE = new Set(["24 Préludes, Op. 28"]);
  const pdfTitle = SCAN_NO_TITLE.has(p.coll) ? osmdTitle : "";
  if (SCORE_SVG[p.id]) return pdfTitle + SCORE_SVG[p.id].map(src=>`<img class="score-svg-page" src="${src}" alt="${p.title} score">`).join("");
  // MVP: public-domain PDF page-strips take precedence over live XML engraving wherever we have them
  if (window.SCORE_IMG && window.SCORE_IMG[p.id]) return pdfTitle + pdfViewer(p, variant);
  if (PIECE_XML[p.id]) return osmdTitle + `<div class="osmd-host" id="pieceOsmd" style="${variant==='focus'?'':'max-height:320px;overflow:hidden'}"></div>`;
  if (SCORE_FILES[p.id]) return osmdTitle + `<div class="osmd-host" id="pieceOsmd" data-src="${SCORE_FILES[p.id]}" style="${variant==='focus'?'':'max-height:320px;overflow:hidden'}"></div>`;
  return `<div class="score-empty">
    <div class="score-empty-ic">${IC.music}</div>
    <div class="score-empty-t">No score added for this piece yet</div>
    <div class="score-empty-s">Real public-domain scores are in for 7 Ravel works so far — this one is on the list.</div>
  </div>`;
}

    });

    let updPageInfo = ()=>{}, currentPage = ()=>0, goToPage = ()=>{};
    if (isBook) {
      // book pager: horizontal flip with arrows / swipe. One page per view normally; in enlarge on a
      // wide landscape screen (iPad+) the CSS lays pages out 2-up, so a "view" = a two-page spread.
      const pageInfo = pane.querySelector("#pgInfo");
      const nPages = () => scroll.querySelectorAll(".pdf-page").length || 1;
      const perView = () => { const pg = scroll.querySelector(".pdf-page"); return pg ? Math.max(1, Math.round(scroll.clientWidth / pg.offsetWidth)) : 1; };
      let curPage = 0;   // 0-based index of the leftmost visible page
      currentPage = () => curPage;
      goToPage = p => { const pv = perView(); scroll.scrollLeft = Math.floor(Math.max(0, p) / pv) * scroll.clientWidth; };
      updPageInfo = () => {
        if (!pageInfo) return;
        const n = nPages(), pv = perView(), first = Math.min(Math.max(0, curPage), n - 1);
        const last = Math.min(first + pv - 1, n - 1);
        pageInfo.textContent = (last > first) ? `${first+1}–${last+1}/${n}` : `${first+1}/${n}`;
      };
      const syncFromScroll = () => { curPage = Math.round(scroll.scrollLeft / Math.max(1, scroll.clientWidth)) * perView(); updPageInfo(); };
      const jumpPage = dir => scroll.scrollBy({ left: dir * scroll.clientWidth, behavior:"smooth" });
      pane.querySelector("#pgNext").addEventListener("click", ()=> jumpPage(1));
      pane.querySelector("#pgPrev").addEventListener("click", ()=> jumpPage(-1));
      scroll.addEventListener("scroll", syncFromScroll, { passive:true });
      // rotation / enlarge toggle changes the view width (and 1-up ↔ 2-up) — keep the leftmost page put
      if (window.ResizeObserver) {
        let lastW = 0;
        new ResizeObserver(()=>{ const w = Math.round(scroll.clientWidth); if (w === lastW) return; lastW = w; goToPage(curPage); updPageInfo(); }).observe(scroll);
      }
      updPageInfo();
    } else if (isPdf) {
      // legacy tall combined strip: up/down flips one strip's worth, anchored to the actual image tops
      const jumpPage = dir => {
        const imgs = [...scroll.querySelectorAll(".pdf-img")];
        const step = scroll.clientHeight * 0.9;
        if (imgs.length < 2) { scroll.scrollBy({top: dir*step, behavior:"smooth"}); return; }
        const topIn = el => { let y = 0; while (el && el !== scroll) { y += el.offsetTop; el = el.offsetParent; } return y; };
        const tops = imgs.map(topIn); tops[0] = 0;
        const cur = scroll.scrollTop;
        let target;
        if (dir > 0) { const np = tops.find(t => t > cur + 8); target = (np != null && np <= cur + step) ? np : cur + step; }
        else         { const pp = tops.filter(t => t < cur - 8).pop(); target = (pp != null && pp >= cur - step) ? pp : cur - step; }
        scroll.scrollTo({ top: Math.max(0, target), behavior:"smooth" });
      };
      pane.querySelector("#pgNext").addEventListener("click", ()=> jumpPage(1));
      pane.querySelector("#pgPrev").addEventListener("click", ()=> jumpPage(-1));
    } else {
      // OSMD notation: each page fits the screen → up/down flips exactly one reading page.
      // Fall back to a system-snap (never cut a row) if there's only a single page.
      const jumpXml = dir => {
        const oh = scroll.querySelector(".osmd-host");
        const pages = oh && oh._pageTops, sys = oh && oh._sysTops;
        const step = scroll.clientHeight * 0.9;
        const ohTop = () => oh.getBoundingClientRect().top - scroll.getBoundingClientRect().top + scroll.scrollTop;
        const cur = scroll.scrollTop;
        if (pages && pages.length > 1) {
          const abs = pages.map(t => t + ohTop());
          abs[0] = 0;   // page 1 view = the very top (on-sheet title + first rows), so ▼ advances to page 2
          const target = dir > 0 ? abs.find(t => t > cur + 8) : abs.filter(t => t < cur - 8).pop();
          if (target != null) { scroll.scrollTo({ top: Math.max(0, target), behavior:"smooth" }); return; }
        }
        if (sys && sys.length > 1) {
          const abs = sys.map(t => t + ohTop());
          let snap = dir > 0
            ? (abs.filter(y => y > cur + 8 && y <= cur + step + 8).pop() ?? abs.find(y => y > cur + 8))
            : (abs.filter(y => y >= cur - step - 8 && y < cur - 8).shift() ?? (abs.filter(y => y < cur - 8)[0] ?? 0));
          if (snap != null) { scroll.scrollTo({ top: Math.max(0, snap - 6), behavior:"smooth" }); return; }
        }
        scroll.scrollBy({top: dir*step, behavior:"smooth"});
      };
      pane.querySelector("#pgNext").addEventListener("click", ()=> jumpXml(1));
      pane.querySelector("#pgPrev").addEventListener("click", ()=> jumpXml(-1));
    }
    pane.querySelector("#zoomIn").addEventListener("click", ()=>{ sheetCtx.zoom=Math.min(3, sheetCtx.zoom+0.25); applyZoom(pane); });
    pane.querySelector("#zoomOut").addEventListener("click", ()=>{ sheetCtx.zoom=Math.max(0.5, sheetCtx.zoom-0.25); applyZoom(pane); });
    const fullBtn = pane.querySelector("#fullBtn");
    const pgPrev = pane.querySelector("#pgPrev"), pgNext = pane.querySelector("#pgNext");
    // floating panel: auto-hide after 10s of no interaction (book pager, default + enlarge); any tap/scroll brings it back
    let panelTimer = null;
    function pokePanel(){
      if (!fv.classList.contains("fake-fs") && !fv.classList.contains("pdf-book")) return;
      fv.classList.remove("panel-hidden");
      clearTimeout(panelTimer);
      panelTimer = setTimeout(()=> fv.classList.add("panel-hidden"), 10000);
    }
    fv.addEventListener("pointerdown", pokePanel);
    scroll.addEventListener("scroll", pokePanel, { passive:true });
    pokePanel();   // start the auto-hide timer for the default book view too
    wirePinchZoom(fv, scroll);
    function enterFs(){
      const pg = currentPage();
      fv.classList.add("fake-fs"); document.body.classList.add("fs-active");
      fullBtn.innerHTML = shrink; fullBtn.title = "Exit full screen";
      if (isBook) requestAnimationFrame(()=>{ goToPage(pg); updPageInfo(); });   // keep the same page (1-up ↔ 2-up spread)
      else scroll.scrollTop = 0;
      pokePanel();
    }
    function exitFs(){
      const pg = currentPage();
      fv.classList.remove("fake-fs", "panel-hidden"); document.body.classList.remove("fs-active");
      clearTimeout(panelTimer);
      fullBtn.innerHTML = full; fullBtn.title = "Full screen";
      if (isBook) requestAnimationFrame(()=>{ goToPage(pg); updPageInfo(); });   // keep the same page
      pokePanel();
    }
    fullBtn.addEventListener("click", ()=>{ fv.classList.contains("fake-fs") ? exitFs() : enterFs(); });
    pane.querySelector("#fsClose").addEventListener("click", exitFs);
  }
}

function applyZoom(pane){
  const z=pane.querySelector("#focusZoom"), val=pane.querySelector("#zoomVal");
  if (z) z.style.transform = `scale(${sheetCtx.zoom})`;
  if (val) val.textContent = Math.round(sheetCtx.zoom*100)+"%";
}

/* Pinch-to-zoom on the score (phone/iPad): two fingers scale the page under the fingers,
   one finger pans while zoomed in; pinching back out releases normal scrolling/paging.
   Works on page-strip images (incl. enlarge), OSMD notation and warm-up exercises. */
function wirePinchZoom(fv, scroll){
  if (!scroll) return;
  const hasTouch = "ontouchstart" in window;
  let tgt=null, scale=1, tx=0, ty=0;
  let pinching=false, s0=1, d0=1, c0=null, q0=null, pan=null, bw=0, bh=0;
  const mid  = ts => ({ x:(ts[0].clientX+ts[1].clientX)/2, y:(ts[0].clientY+ts[1].clientY)/2 });
  const dist = ts => Math.hypot(ts[0].clientX-ts[1].clientX, ts[0].clientY-ts[1].clientY);
  const apply = ()=>{ if(!tgt) return; tgt.style.transition="none"; tgt.style.transformOrigin="center center";
    tgt.style.transform = scale>1.001 ? `translate(${tx}px,${ty}px) scale(${scale})` : ""; };
  const reset = ()=>{ if(tgt){ tgt.style.transform=""; tgt.style.transition=""; tgt.style.transformOrigin=""; }
    tgt=null; scale=1; tx=0; ty=0; pan=null; pinching=false; };
  const clampPan = ()=>{ const mx=Math.max(0,(scale-1)*bw/2), my=Math.max(0,(scale-1)*bh/2);
    tx=Math.min(mx,Math.max(-mx,tx)); ty=Math.min(my,Math.max(-my,ty)); };
  scroll.addEventListener("touchstart", e=>{
    if (e.touches.length===2){
      e.preventDefault();   // keep the browser/page from pinch-zooming the whole UI
      const m = mid(e.touches);
      if (!tgt){
        const el = document.elementFromPoint(m.x, m.y), pg = el && el.closest(".pdf-page");
        tgt = (pg && (pg.querySelector(".pdf-img") || pg)) || scroll.querySelector(".wu-figure, .osmd-host, .focus-zoom");
        if (!tgt) return;
      }
      const r = tgt.getBoundingClientRect();
      bw = r.width/scale; bh = r.height/scale;
      c0 = { x: r.left + r.width/2 - tx, y: r.top + r.height/2 - ty };       // untransformed centre
      q0 = { x: (m.x - c0.x - tx)/scale, y: (m.y - c0.y - ty)/scale };       // content point under the fingers
      s0 = scale; d0 = dist(e.touches) || 1; pinching = true; pan = null;
    } else if (e.touches.length===1 && scale>1){
      pan = { x: e.touches[0].clientX - tx, y: e.touches[0].clientY - ty };
    }
  }, { passive:false });
  scroll.addEventListener("touchmove", e=>{
    if (pinching && e.touches.length===2){
      e.preventDefault();
      const m = mid(e.touches);
      scale = Math.min(4, Math.max(1, s0 * dist(e.touches)/d0));
      tx = m.x - c0.x - q0.x*scale; ty = m.y - c0.y - q0.y*scale;
      clampPan(); apply();
    } else if (pan && e.touches.length===1 && scale>1){
      e.preventDefault();   // pan the zoomed page instead of scrolling/flipping
      tx = e.touches[0].clientX - pan.x; ty = e.touches[0].clientY - pan.y;
      clampPan(); apply();
    }
  }, { passive:false });
  const end = e=>{
    if (e.touches.length < 2) pinching = false;
    if (e.touches.length === 0){ pan = null; if (scale < 1.05) reset(); }
  };
  scroll.addEventListener("touchend", end);
  scroll.addEventListener("touchcancel", end);
  // desktop: trackpad pinch (ctrl+wheel / Safari gesture events) zooms inside the score
  // container too — instead of browser page-zoom; dragging pans while zoomed in
  const ensureTgt = (x,y)=>{
    if (tgt) return tgt;
    const el = document.elementFromPoint(x,y), pg = el && el.closest(".pdf-page");
    tgt = (pg && (pg.querySelector(".pdf-img") || pg)) || scroll.querySelector(".wu-figure, .osmd-host, .focus-zoom");
    if (tgt){ const r = tgt.getBoundingClientRect(); bw = r.width/scale; bh = r.height/scale; }
    return tgt;
  };
  const zoomAt = (x,y,ns)=>{
    const r = tgt.getBoundingClientRect();
    const c = { x: r.left + r.width/2 - tx, y: r.top + r.height/2 - ty };
    const q = { x: (x - c.x - tx)/scale, y: (y - c.y - ty)/scale };
    scale = Math.min(4, Math.max(1, ns));
    tx = x - c.x - q.x*scale; ty = y - c.y - q.y*scale;
    clampPan(); apply();
  };
  scroll.addEventListener("wheel", e=>{
    if (!e.ctrlKey && !e.metaKey) return;           // trackpad pinch arrives as ctrl+wheel
    e.preventDefault();
    if (!ensureTgt(e.clientX, e.clientY)) return;
    zoomAt(e.clientX, e.clientY, scale * Math.exp(-e.deltaY * 0.01));
    if (scale <= 1.01) reset();
  }, { passive:false });
  if (!hasTouch){
    let gs = 1;   // Safari (macOS) reports trackpad pinch via gesture events
    scroll.addEventListener("gesturestart",  e=>{ e.preventDefault(); gs = scale; ensureTgt(e.clientX, e.clientY); });
    scroll.addEventListener("gesturechange", e=>{ e.preventDefault(); if (tgt) zoomAt(e.clientX, e.clientY, gs * e.scale); });
    scroll.addEventListener("gestureend",    e=>{ e.preventDefault(); if (scale < 1.05) reset(); });
    scroll.addEventListener("mousedown", e=>{
      if (scale <= 1) return;
      e.preventDefault();
      const sx = e.clientX - tx, sy = e.clientY - ty;
      const mv = ev=>{ tx = ev.clientX - sx; ty = ev.clientY - sy; clampPan(); apply(); };
      const up = ()=>{ document.removeEventListener("mousemove", mv); document.removeEventListener("mouseup", up); };
      document.addEventListener("mousemove", mv); document.addEventListener("mouseup", up);
    });
  }
  // page flip / programmatic scroll while not gesturing → drop the zoom
  scroll.addEventListener("scroll", ()=>{ if (!pinching && !pan && scale>1) reset(); }, { passive:true });
}

/* ---- metronome via Web Audio ---- */
let audioCtx = null, metroInterval = null, metroBeat = 0;
function startMetro(dots) {
  audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
  if (audioCtx.state==="suspended") audioCtx.resume();
  metroBeat = 0;
  const tick = () => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    const accent = metroBeat % 4 === 0;
    o.frequency.value = accent ? 1500 : 1000;
    g.gain.setValueAtTime(accent?0.5:0.28, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime+0.05);
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+0.06);
    dots.forEach((d,i)=>d.classList.toggle("beat", i===metroBeat%4));
    metroBeat++;
  };
  tick();
  metroInterval = setInterval(tick, 60000/sheetCtx.bpm);
}
function stopMetro(dots){ clearInterval(metroInterval); metroInterval=null; if(dots) dots.forEach(d=>d.classList.remove("beat")); }
function restartMetro(){ const dots=document.querySelectorAll("#metroDots i"); stopMetro(dots); startMetro(dots); }
function stopAllPractice() {
  if (!sheetCtx) return;
  clearInterval(sheetCtx.playTimer); clearInterval(sheetCtx.timer);
  stopMetro(document.querySelectorAll("#metroDots i"));
  stopPlayback();
  if (sheetCtx.timerOn) save();
  sheetCtx.playing=sheetCtx.timerOn=sheetCtx.metroOn=false;
}

/* ---- real playback: sampled grand piano (Salamander) driven by MusicXML notes ---- */
let playback = null;
let playStarting = false, playCancel = false;
let sampler = null; // { ctx, buffers:{midi:AudioBuffer}, midis:[], ready:Promise }
// pre-decode piano samples on the first user gesture so the first Play is instant (no decode delay)
window.addEventListener("pointerdown", function warm(){ try{ getSampler(); }catch(e){} window.removeEventListener("pointerdown", warm); }, { once:true });
function isPlayable(id){ return !!(window.SCORE_NOTES && window.SCORE_NOTES[id]); }
function getSampler(){
  if (sampler) return sampler;
  const ctx = new (window.AudioContext||window.webkitAudioContext)();
  const buffers = {};
  const entries = Object.entries(window.PIANO_SAMPLES || {});
  const ready = Promise.all(entries.map(([midi,uri])=>{
    const bin = atob(uri.split(",").pop());
    const arr = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    return ctx.decodeAudioData(arr.buffer).then(buf=>{ buffers[+midi]=buf; });
  }));
  sampler = { ctx, buffers, midis: entries.map(e=>+e[0]).sort((a,b)=>a-b), ready };
  return sampler;
}
function stopPlayback(){
  if (playStarting) playCancel = true;   // abort an in-flight start too
  if (!playback) return;
  clearInterval(playback.tick);
  playback.nodes.forEach(n=>{ try{ n.stop(); }catch(e){} });
  playback = null;
  const hp = document.querySelector("#hdrPlay"); if (hp) hp.innerHTML = IC.play;
  const fill = document.querySelector("#trackFill"); if (fill) fill.style.width = "0%";
  const tc = document.querySelector("#tCur"); if (tc) tc.textContent = "0:00";
}
async function playPiece(id, onProgress, onEnd){
  stopPlayback();
  const data = window.SCORE_NOTES && window.SCORE_NOTES[id];
  if (!data || !data.notes.length) return false;
  const S = getSampler();
  await S.ready;
  if (playCancel) { playCancel = false; return false; }   // user tapped stop during startup
  const ctx = S.ctx;
  if (ctx.state === "suspended") await ctx.resume();
  if (playCancel) { playCancel = false; return false; }
  const spb = 60/(sheetCtx.bpm || data.bpm || 72);   // seconds per quarter, follows the tempo tag
  const t0 = ctx.currentTime + 0.25;
  const master = ctx.createGain(); master.gain.value = 0.85; master.connect(ctx.destination);
  const nodes = []; let musicEnd = 0;
  data.notes.forEach(([midi,off,dur])=>{
    // nearest recorded sample, pitch-shifted to the target note
    let best = S.midis[0];
    for (const m of S.midis) if (Math.abs(m-midi) < Math.abs(best-midi)) best = m;
    const buf = S.buffers[best]; if (!buf) return;
    const start = t0 + off*spb, held = Math.max(0.15, dur*spb);
    const src = ctx.createBufferSource(); src.buffer = buf; src.playbackRate.value = Math.pow(2,(midi-best)/12);
    const g = ctx.createGain(); g.gain.setValueAtTime(0.85, start);
    const relEnd = start + held + 0.35;                 // let the note ring, then release
    g.gain.setValueAtTime(0.85, start + held);
    g.gain.exponentialRampToValueAtTime(0.0001, relEnd);
    src.connect(g); g.connect(master); src.start(start); src.stop(relEnd + 0.05);
    nodes.push(src); musicEnd = Math.max(musicEnd, off+dur);
  });
  playback = { ctx, nodes };
  const total = musicEnd*spb;
  playback.tick = setInterval(()=>{
    const el = ctx.currentTime - t0;
    onProgress && onProgress(Math.max(0,Math.min(1, el/total)), Math.max(0, el));
    if (el >= total) { onEnd && onEnd(); stopPlayback(); }
  }, 100);
  return true;
}
function togglePlay(id){
  if (playback) { stopPlayback(); return; }
  if (playStarting) { playCancel = true; return; }   // still decoding/scheduling → cancel this start
  track("piece_play", { id });
  playStarting = true; playCancel = false;
  const hp = document.querySelector("#hdrPlay"); if (hp) hp.innerHTML = IC.pause;
  const fill = document.querySelector("#trackFill"), tCur = document.querySelector("#tCur");
  playPiece(id,
    (frac,el)=>{ if(fill) fill.style.width=(frac*100)+"%"; if(tCur) tCur.textContent=fmtClock(Math.floor(el)); },
    ()=>{}).then(ok=>{ playStarting = false; if(!ok && hp) hp.innerHTML = IC.play; });
}

// keep the screen awake while practicing — held for S.keepAwake minutes after the last interaction

let _wakeLock=null, _wakeTimer=null;
async function _wakeAcquire(){ try{ if("wakeLock" in navigator && document.visibilityState==="visible" && !_wakeLock){ _wakeLock = await navigator.wakeLock.request("screen"); _wakeLock.addEventListener("release", ()=>{ _wakeLock=null; }); } }catch(e){} }
function _wakeRelease(){ try{ if(_wakeLock){ _wakeLock.release(); _wakeLock=null; } }catch(e){} clearTimeout(_wakeTimer); }
function bumpWake(){
  clearTimeout(_wakeTimer);
  const opt = S.keepAwake;
  if(opt==="off"){ _wakeRelease(); return; }
  _wakeAcquire();
  if(opt!=="always"){ _wakeTimer = setTimeout(_wakeRelease, (parseInt(opt,10)||10)*60000); }
}
["pointerdown","keydown","touchstart"].forEach(ev=>document.addEventListener(ev, bumpWake, {passive:true}));
(function(){ const sc=document.getElementById("screen"); if(sc) sc.addEventListener("scroll", bumpWake, {passive:true}); })();
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") bumpWake(); });
bumpWake();
routeTo(location.hash);
</script>
