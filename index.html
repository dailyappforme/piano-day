/* level: 1–10 difficulty. dur: minutes. mode derived from key text. */
const PIECES = [
  {"id":"rav-pavane","c":"ravel","title":"Pavane pour une infante défunte","sub":"M.19","key":"G major","level":5,"year":1899,"dur":6,"story":"A 'pavane for a dead princess' — not a lament for anyone real, but for a stately Spanish court dance imagined from the past. Ravel warned pianists not to drag it: 'It is a pavane, not a dead princess.'"},
  {"id":"rav-jeux-deau","c":"ravel","title":"Jeux d'eau","sub":"M.30","key":"E major","level":8,"year":1901,"dur":5.5,"story":"'Play of water' — fountains, cascades and rivulets rendered in glittering figuration. It reinvented piano texture and opened the door to musical Impressionism at the keyboard."},
  {"id":"rav-sonatine-1","c":"ravel","coll":"Sonatine, M.40","title":"Modéré","sub":"Sonatine · No. 1","key":"F♯ minor","level":7,"year":1905,"dur":4.5,"story":"The opening movement, spun almost entirely from a single falling-fourth motif — graceful, transparent and classically poised. It has a delicious backstory: in 1903 Ravel entered it in a magazine competition for the first movement of a sonatina, no longer than 75 bars. He was the *only* person who entered — under the pseudonym 'Verla,' an anagram of his name — and was promptly disqualified for running nine bars over the limit. The magazine then went bankrupt and the whole contest was scrapped, so Ravel added two more movements in 1905 and turned his rejected entry into one of his best-loved works."},
  {"id":"rav-sonatine-2","c":"ravel","coll":"Sonatine, M.40","title":"Mouvement de menuet","sub":"Sonatine · No. 2","key":"D♭ major","level":6,"year":1905,"dur":3.5,"story":"A tender minuet at the heart of the Sonatine, its melody floating over gently rocking harmony."},
  {"id":"rav-sonatine-3","c":"ravel","coll":"Sonatine, M.40","title":"Animé","sub":"Sonatine · No. 3","key":"F♯ minor","level":8,"year":1905,"dur":4,"story":"A glittering, toccata-like finale that whirls the first movement's motif through cascading figuration. Ravel wrote it — with the central minuet — in 1905, two years after the competition-entry first movement, completing the Sonatine as a whole."},
  {"id":"rav-miroirs-1","c":"ravel","coll":"Miroirs, M.43","title":"Noctuelles","sub":"Miroirs · No. 1","key":"D♭ major","level":9,"year":1905,"dur":4.5,"story":"'Night moths' — fluttering, irregular figures darting through the dark. Dedicated to the poet Léon-Paul Fargue."},
  {"id":"rav-miroirs-2","c":"ravel","coll":"Miroirs, M.43","title":"Oiseaux tristes","sub":"Miroirs · No. 2","key":"E♭ minor","level":7,"year":1905,"dur":4,"story":"'Sad birds' — lone calls in a torpid summer forest; Ravel's own favourite of the set."},
  {"id":"rav-miroirs-3","c":"ravel","coll":"Miroirs, M.43","title":"Une barque sur l'océan","sub":"Miroirs · No. 3","key":"F♯ minor","level":9,"year":1905,"dur":7,"story":"'A boat on the ocean' — sweeping arpeggios paint rolling swells and shifting light on the water."},
  {"id":"rav-miroirs-4","c":"ravel","coll":"Miroirs, M.43","title":"Alborada del gracioso","sub":"Miroirs · No. 4","key":"D minor","level":11,"year":1905,"dur":6.5,"story":"'The jester's dawn song' — a dazzling Spanish showpiece of repeated notes and guitar-like snaps."},
  {"id":"rav-miroirs-5","c":"ravel","coll":"Miroirs, M.43","title":"La vallée des cloches","sub":"Miroirs · No. 5","key":"B major","level":8,"year":1905,"dur":5.5,"story":"'The valley of bells' — bells tolling across a still landscape, evoked in layered resonances."},
  {"id":"rav-gaspard-1","c":"ravel","coll":"Gaspard de la nuit, M.55","title":"Ondine","sub":"Gaspard · No. 1","key":"C♯ major","level":11,"year":1908,"dur":6.5,"story":"The water-nymph sings to lure a mortal beneath the lake — a shimmering wash of rapid tremolando."},
  {"id":"rav-gaspard-2","c":"ravel","coll":"Gaspard de la nuit, M.55","title":"Le Gibet","sub":"Gaspard · No. 2","key":"E♭ minor","level":8,"year":1908,"dur":6,"story":"'The gallows' — a corpse sways against a blood-red sunset while a bell tolls an obsessive B♭ throughout."},
  {"id":"rav-gaspard-3","c":"ravel","coll":"Gaspard de la nuit, M.55","title":"Scarbo","sub":"Gaspard · No. 3","key":"G♯ minor","level":11,"year":1908,"dur":9,"story":"A malicious goblin flickers and vanishes in the night — one of the most fiendish pieces ever written."},
  {"id":"rav-menuet-haydn","c":"ravel","title":"Menuet sur le nom d'Haydn","sub":"M.58","key":"G major","level":5,"year":1909,"dur":2,"story":"Written in 1909 for a special issue of the Revue musicale S.I.M. marking the centenary of Haydn's death — one of a set in which six French composers (Ravel, Debussy, Dukas, Reynaldo Hahn, Vincent d'Indy and Widor) each wrote a short tribute on the same theme. The five-note motif B–A–D–D–G spells H-A-Y-D-N through a German note-name cipher, and Ravel threads it through the melody forwards, inverted and in retrograde, as a poised, slightly wistful minuet in G major.\n\nIts cool, classicising bow to the 18th-century dance looks straight ahead to Ravel's wartime suite Le tombeau de Couperin (1917), and belongs to the long 'name-cipher' tradition of musical signatures running from Bach's B-A-C-H to Schumann and Brahms."},
  {"id":"rav-tombeau-1","c":"ravel","coll":"Le tombeau de Couperin, M.68","title":"Prélude","sub":"Tombeau · No. 1","key":"E minor","level":8,"year":1917,"dur":3,"story":"Perpetual-motion triplets in Baroque prelude style; dedicated to a friend killed in the war."},
  {"id":"rav-tombeau-2","c":"ravel","coll":"Le tombeau de Couperin, M.68","title":"Fugue","sub":"Tombeau · No. 2","key":"E minor","level":7,"year":1917,"dur":3,"story":"A gentle three-voice fugue, spare and searching."},
  {"id":"rav-tombeau-3","c":"ravel","coll":"Le tombeau de Couperin, M.68","title":"Forlane","sub":"Tombeau · No. 3","key":"E minor","level":8,"year":1917,"dur":6,"story":"A stylised Italian dance with piquant, bittersweet harmonies."},
  {"id":"rav-tombeau-4","c":"ravel","coll":"Le tombeau de Couperin, M.68","title":"Rigaudon","sub":"Tombeau · No. 4","key":"C major","level":8,"year":1917,"dur":3,"story":"A bright, robust Baroque dance framing a pastoral middle section."},
  {"id":"rav-tombeau-5","c":"ravel","coll":"Le tombeau de Couperin, M.68","title":"Menuet","sub":"Tombeau · No. 5","key":"G major","level":8,"year":1917,"dur":5,"story":"An elegant minuet with a solemn musette at its centre."},
  {"id":"rav-tombeau-6","c":"ravel","coll":"Le tombeau de Couperin, M.68","title":"Toccata","sub":"Tombeau · No. 6","key":"E minor","level":11,"year":1917,"dur":4,"story":"A relentless, brilliant finale — repeated notes building to a blazing close."},
  {"id":"rav-valses-1","c":"ravel","coll":"Valses nobles et sentimentales, M.61","title":"Modéré","sub":"Valses nobles · No. 1","key":"G major","level":8,"year":1911,"dur":1.5,"story":"The set bursts open with clashing appoggiaturas and a swaggering waltz — Ravel taking Schubert's genre and dressing it in biting 20th-century harmony. His epigraph from Henri de Régnier sets the tone: 'the delicious and always-renewed pleasure of a useless occupation.'"},
  {"id":"rav-valses-2","c":"ravel","coll":"Valses nobles et sentimentales, M.61","title":"Assez lent","sub":"Valses nobles · No. 2","key":"G minor","level":7,"year":1911,"dur":2.5,"story":"A wistful, drooping waltz marked 'with intense expression' — one of the tenderest pages in the set, its melody sighing over a gently swaying accompaniment."},
  {"id":"rav-valses-3","c":"ravel","coll":"Valses nobles et sentimentales, M.61","title":"Modéré","sub":"Valses nobles · No. 3","key":"E minor","level":7,"year":1911,"dur":1.5,"story":"Light and quicksilver, marked pp léger — a fleet, delicately spinning waltz that seems to hover just above the keys."},
  {"id":"rav-valses-4","c":"ravel","coll":"Valses nobles et sentimentales, M.61","title":"Assez animé","sub":"Valses nobles · No. 4","key":"A♭ major","level":7,"year":1911,"dur":1.5,"story":"A graceful, lilting waltz with a warm singing line and a touch of playful rubato."},
  {"id":"rav-valses-5","c":"ravel","coll":"Valses nobles et sentimentales, M.61","title":"Presque lent","sub":"Valses nobles · No. 5","key":"E major","level":7,"year":1911,"dur":2,"story":"'Almost slow' — the emotional heart of the set, the melody floating très en dehors over shimmering, softly shifting harmony."},
  {"id":"rav-valses-6","c":"ravel","coll":"Valses nobles et sentimentales, M.61","title":"Vif","sub":"Valses nobles · No. 6","key":"C major","level":7,"year":1911,"dur":1,"story":"A brief, brilliant whirlwind — the quickest of the eight, gone almost before it begins."},
  {"id":"rav-valses-7","c":"ravel","coll":"Valses nobles et sentimentales, M.61","title":"Moins vif","sub":"Valses nobles · No. 7","key":"A major","level":9,"year":1911,"dur":3.5,"story":"The grandest and longest of the eight — sweeping and voluptuous, and often singled out as the finest waltz of the set."},
  {"id":"rav-valses-8","c":"ravel","coll":"Valses nobles et sentimentales, M.61","title":"Épilogue: Lent","sub":"Valses nobles · No. 8","key":"G major","level":8,"year":1911,"dur":3.5,"story":"A dreamlike epilogue that recalls fragments of the earlier waltzes as if through memory, dissolving at last into stillness."},
  {"id":"rav-menuet-antique","c":"ravel","title":"Menuet antique","sub":"M.7","key":"F♯ minor","level":6,"year":1895,"dur":5,"story":"Ravel's first published work, written at twenty while still a student at the Paris Conservatoire. A minuet at once joyful and nostalgic — its chromatic harmony and archaic modal turns already unmistakably his own, with a central section nodding to Chabrier. Dedicated to the pianist Ricardo Viñes, who championed so much of Ravel's music."},
  {"id":"cho-noc92","c":"chopin","coll":"Nocturnes","title":"Nocturne in E♭ major","sub":"Op. 9 No. 2","key":"E♭ major","level":5,"year":1832,"dur":4.5,"story":"Chopin's most beloved nocturne, written when he was barely twenty. Its singing right-hand line is meant to imitate the bel canto opera he adored — every return of the theme is decorated a little differently, as a great singer would ornament a repeat."},
  {"id":"cho-fantimp","c":"chopin","coll":"Impromptus","title":"Fantaisie-Impromptu","sub":"Op. 66","key":"C♯ minor","level":8,"year":1834,"dur":5,"story":"Chopin never published this piece and asked for it to be destroyed after his death; his friend Julian Fontana printed it anyway. The famous cross-rhythm — four notes against three — is its central technical puzzle."},
  {"id":"cho-bal1","c":"chopin","coll":"Ballades","title":"Ballade No. 1 in G minor","sub":"Op. 23","key":"G minor","level":9,"year":1836,"dur":9,"story":"The first of Chopin's four ballades and possibly the single most iconic Romantic piano work. Schumann admired it deeply, and its coda is one of the most terrifying páginas in the repertoire."},
  {"id":"cho-minute","c":"chopin","coll":"Waltzes","title":"Waltz in D♭ major (Minute)","sub":"Op. 64 No. 1","key":"D♭ major","level":7,"year":1847,"dur":2,"story":"Nicknamed the 'Minute Waltz' — though it was never meant to be played in sixty seconds. Chopin's own title, 'Valse du petit chien', refers to a little dog chasing its tail, which the whirling figures depict."},
  {"id":"cho-et103","c":"chopin","coll":"Études, Op. 10","title":"Étude in E major (Tristesse)","sub":"Op. 10 No. 3","key":"E major","level":7,"year":1832,"dur":4,"story":"Chopin reportedly said he had 'never written such a beautiful melody' as this one. The tender outer sections frame a stormy middle built from painful stretched intervals."},
  {"id":"cho-pre284","c":"chopin","coll":"24 Préludes, Op. 28","title":"Prélude in E minor","sub":"Op. 28 No. 4","key":"E minor","level":3,"year":1839,"dur":2,"story":"One of the 24 Préludes, Op. 28 — Chopin's homage to Bach's Well-Tempered Clavier, with one prélude in every key. He drafted much of the set during a bleak, illness-plagued winter on Majorca with George Sand in 1838–39. Over a slowly sinking chromatic left hand, the right hand grieves in tiny sighs — a study in harmony doing the most with the least. It was played on the organ at Chopin's own funeral, and its chromatic voice-leading pointed the way toward Wagner and the late Romantics."},
  {"id":"cho-rev","c":"chopin","coll":"Études, Op. 10","title":"Étude in C minor (Revolutionary)","sub":"Op. 10 No. 12","key":"C minor","level":9,"year":1831,"dur":3,"story":"Legend links it to the fall of Warsaw to Russia while Chopin was abroad. The tempest of left-hand semiquavers under a defiant right-hand anthem makes it a benchmark of the left hand."},
  {"id":"cho-noc272","c":"chopin","coll":"Nocturnes","title":"Nocturne in D♭ major","sub":"Op. 27 No. 2","key":"D♭ major","level":7,"year":1835,"dur":6,"story":"A duet without words: two intertwining voices in the right hand float over rolling left-hand harmony. The challenge is colour and rubato rather than raw speed."},
  {"id":"cho-pre287","c":"chopin","coll":"24 Préludes, Op. 28","title":"Prélude in A major","sub":"Op. 28 No. 7","key":"A major","level":3,"year":1839,"dur":0.8,"story":"At just sixteen bars, the shortest breath in the Op. 28 set — a single mazurka phrase lifted from Chopin's Polish roots and distilled to an aphorism. Its gentle lilt hides one aching chromatic chord that many students meet as their first taste of real Chopin harmony. So beloved that Federico Mompou built an entire set of 'Variations on a Theme of Chopin' upon it."},
  {"id":"cho-pre2815","c":"chopin","coll":"24 Préludes, Op. 28","title":"Prélude in D♭ major (Raindrop)","sub":"Op. 28 No. 15","key":"D♭ major","level":6,"year":1839,"dur":3.4,"story":"The longest and most famous of the Op. 28 préludes, nicknamed the 'Raindrop' after George Sand described rain dripping from the roof of their Majorca monastery as Chopin composed. A single repeated note tolls without pause through a serene opening and a dark, storm-heavy middle in C♯ minor. That hypnotic pedal-tone became a model for evoking atmosphere at the keyboard — an idea Debussy and the Impressionists would take much further."},
  {"id":"cho-pre2820","c":"chopin","coll":"24 Préludes, Op. 28","title":"Prélude in C minor","sub":"Op. 28 No. 20","key":"C minor","level":4,"year":1839,"dur":1,"story":"Barely thirteen bars of solemn block chords — a funeral march compressed to its essence. Its stark, noble harmony proved irresistible to later composers: Rachmaninoff built his Variations on a Theme of Chopin, Op. 22 on it, and Busoni wrote a set of variations too. Proof of how much weight Chopin could pack into a handful of chords."},
  {"id":"cho-pre286","c":"chopin","coll":"24 Préludes, Op. 28","title":"Prélude in B minor","sub":"Op. 28 No. 6","key":"B minor","level":4,"year":1839,"dur":1.3,"story":"A song for the left hand — the melody sings low in the piano's cello register while the right hand murmurs quiet repeated chords above, inverting the usual roles. Written in the same Majorca winter, its mood of resigned lament is so close to the E-minor prélude that the two were paired on the organ at Chopin's funeral."},
  {"id":"cho-007-001","c":"chopin","coll":"Mazurkas","title":"Mazurka in B♭ major","sub":"Op. 7 No. 1","key":"B♭ major","level":4,"year":1831,"dur":3,"story":"The most popular of Chopin's first published mazurkas — bright and stamping, with a drone fifth in the bass that imitates the Polish bagpipe (dudy) and a spicy raised-fourth that gives it a rustic, open-air tang."},
  {"id":"cho-007-002","c":"chopin","coll":"Mazurkas","title":"Mazurka in A minor","sub":"Op. 7 No. 2","key":"A minor","level":5,"year":1831,"dur":3,"story":"A wistful, swaying mazurka that alternates a plaintive minor tune with a brighter major trio — tender and folk-flavoured."},
  {"id":"cho-007-003","c":"chopin","coll":"Mazurkas","title":"Mazurka in F minor","sub":"Op. 7 No. 3","key":"F minor","level":6,"year":1831,"dur":3,"story":"A darker, more searching mazurka with a drone-bass opening and chromatic turns of quiet melancholy."},
  {"id":"cho-007-004","c":"chopin","coll":"Mazurkas","title":"Mazurka in A♭ major","sub":"Op. 7 No. 4","key":"A♭ major","level":5,"year":1831,"dur":1.5,"story":"A brief, lilting mazurka, 'Presto ma non troppo' — light-footed and charming, over almost before it starts."},
  {"id":"cho-007-005","c":"chopin","coll":"Mazurkas","title":"Mazurka in C major","sub":"Op. 7 No. 5","key":"C major","level":4,"year":1831,"dur":1.5,"story":"A tiny perpetual-motion mazurka that circles back on itself with a drone bass — marked to end 'da capo senza fine,' spinning on forever."},
  {"id":"cho-017-001","c":"chopin","coll":"Mazurkas","title":"Mazurka in B♭ major","sub":"Op. 17 No. 1","key":"B♭ major","level":5,"year":1833,"dur":2.5,"story":"A proud, resolute mazurka, 'Vivo e risoluto' — bold and stamping, opening the Op. 17 set with confident swagger."},
  {"id":"cho-017-002","c":"chopin","coll":"Mazurkas","title":"Mazurka in E minor","sub":"Op. 17 No. 2","key":"E minor","level":5,"year":1833,"dur":2.5,"story":"A gently melancholy mazurka, 'Lento ma non troppo' — its drooping phrases coloured by tender, sighing chromaticism."},
  {"id":"cho-017-003","c":"chopin","coll":"Mazurkas","title":"Mazurka in A♭ major","sub":"Op. 17 No. 3","key":"A♭ major","level":6,"year":1833,"dur":3.5,"story":"A graceful, flowing mazurka, 'Legato assai' — long-breathed and songful, one of the loveliest of the early sets."},
  {"id":"cho-063-001","c":"chopin","coll":"Mazurkas","title":"Mazurka in B major","sub":"Op. 63 No. 1","key":"B major","level":6,"year":1846,"dur":2.5,"story":"From Chopin's last published mazurkas — bright and vivacious, but shot through with the harmonic subtlety of his late style."},
  {"id":"cho-063-002","c":"chopin","coll":"Mazurkas","title":"Mazurka in F minor","sub":"Op. 63 No. 2","key":"F minor","level":6,"year":1846,"dur":2,"story":"A tender, resigned little mazurka, 'Lento' — quietly nostalgic, a moment of late-Chopin intimacy."},
  {"id":"cho-009-001","c":"chopin","coll":"Nocturnes","title":"Nocturne in B♭ minor","sub":"Op. 9 No. 1","key":"B♭ minor","level":6,"year":1832,"dur":5,"story":"The opening of Chopin's very first set of nocturnes, published when he was 22. A long, ornamented melody floats over a rocking left hand, then melts into a serene D-flat major middle — the sound that made his name in the Paris salons."},
  {"id":"cho-009-003","c":"chopin","coll":"Nocturnes","title":"Nocturne in B major","sub":"Op. 9 No. 3","key":"B major","level":8,"year":1832,"dur":6,"story":"The most elaborate of the Op. 9 set — a graceful, 'scherzando' outer song frames a stormy, agitated middle in B minor, showing Chopin's early flair for drama within the nocturne."},
  {"id":"cho-noc-cposth","c":"chopin","coll":"Nocturnes","title":"Nocturne in C♯ minor (Lento con gran espressione)","sub":"Op. posth.","key":"C♯ minor","level":6,"year":1830,"dur":4,"story":"Written when Chopin was 20 and published only after his death — intimate and improvisatory, it quotes his own F-minor Concerto. Made famous by the film The Pianist, it's one of his most beloved posthumous works."},
  {"id":"cho-020-001","c":"chopin","coll":"Scherzos","title":"Scherzo No. 1 in B minor","sub":"Op. 20","key":"B minor","level":11,"year":1835,"dur":9.5,"story":"A ferocious, anguished scherzo that erupts with two hammered dissonant chords — at its heart, a tender Polish Christmas carol ('Lulajże Jezuniu') glows before the storm returns and hurls itself to a violent close."},
  {"id":"cho-010-001","c":"chopin","coll":"Études, Op. 10","title":"Étude in C major","sub":"Op. 10 No. 1","key":"C major","level":9,"year":1833,"dur":2.5,"story":"The étude that opens Op. 10 — a cathedral of sweeping right-hand arpeggios rolling across the whole keyboard over a firm C-major bass, a deliberate echo of the first prelude of Bach's Well-Tempered Clavier and a radical stretch for the hand."},
  {"id":"cho-010-005","c":"chopin","coll":"Études, Op. 10","title":"Étude in G♭ major (Black Keys)","sub":"Op. 10 No. 5","key":"G♭ major","level":9,"year":1833,"dur":2.5,"story":"The 'Black Key' étude — the right hand dances almost entirely on the black keys in a glittering, playful whirl. Chopin thought it a slight piece, but audiences have adored its sparkle ever since."},
  {"id":"cho-010-002","c":"chopin","coll":"Études, Op. 10","title":"Étude in A minor","sub":"Op. 10 No. 2","key":"A minor","level":9,"year":1833,"dur":1.5,"story":"A study in pure chromatic velocity for the weakest fingers — the right hand runs unbroken chromatic scales with fingers 3, 4 and 5 while the thumb and index play a quiet accompaniment beneath. One of the most unforgiving tests of finger independence ever written."},
  {"id":"cho-010-004","c":"chopin","coll":"Études, Op. 10","title":"Étude in C♯ minor","sub":"Op. 10 No. 4","key":"C♯ minor","level":9,"year":1833,"dur":2,"story":"Presto con fuoco — a torrent of cascading sixteenth-notes hurled between the hands without pause. Relentless, brilliant and thrilling, it's one of the great encore études."},
  {"id":"cho-010-006","c":"chopin","coll":"Études, Op. 10","title":"Étude in E♭ minor","sub":"Op. 10 No. 6","key":"E♭ minor","level":7,"year":1833,"dur":3.5,"story":"The slow, grieving heart of the set — a long chromatic melody sighing over a restless inner voice. Less a technical exercise than a study in sustained, singing melancholy."},
  {"id":"cho-010-007","c":"chopin","coll":"Études, Op. 10","title":"Étude in C major (Toccata)","sub":"Op. 10 No. 7","key":"C major","level":8,"year":1833,"dur":1.5,"story":"A bright toccata in double notes — the right hand snaps between held and moving voices while the piece bounces along with irrepressible good humour."},
  {"id":"cho-010-008","c":"chopin","coll":"Études, Op. 10","title":"Étude in F major","sub":"Op. 10 No. 8","key":"F major","level":9,"year":1833,"dur":2.5,"story":"Sunlight in sound — brilliant right-hand cascades sweep up and down the keyboard over a bold, singing left-hand tune. Exuberant and joyous from first note to last."},
  {"id":"cho-010-009","c":"chopin","coll":"Études, Op. 10","title":"Étude in F minor","sub":"Op. 10 No. 9","key":"F minor","level":8,"year":1833,"dur":2,"story":"Allegro molto agitato — an impassioned melody strains over a wide, churning left-hand accompaniment that stretches the hand restlessly. Dark, urgent and deeply Romantic."},
  {"id":"cho-010-010","c":"chopin","coll":"Études, Op. 10","title":"Étude in A♭ major","sub":"Op. 10 No. 10","key":"A♭ major","level":10,"year":1833,"dur":2,"story":"A study in shifting accents and articulation — the same rolling figuration is re-shaded again and again by moving the stress around. Von Bülow called mastering it the mark of a finished pianist."},
  {"id":"cho-010-011","c":"chopin","coll":"Études, Op. 10","title":"Étude in E♭ major (Arpeggio)","sub":"Op. 10 No. 11","key":"E♭ major","level":9,"year":1833,"dur":2.5,"story":"Nearly every chord is spread as a rolling arpeggio, top to bottom, so the piano seems to become a giant guitar or harp. Tender and luminous, it asks for a singing top voice above shimmering rolled harmony."},
  {"id":"cho-017-004","c":"chopin","coll":"Mazurkas","title":"Mazurka in A minor","sub":"Op. 17 No. 4","key":"A minor","level":4,"year":1833,"dur":3,"story":"The most haunting of the Op. 17 mazurkas — veiled and nostalgic, it opens and closes on an unresolved, questioning harmony, so that the music seems to fade in from nowhere and dissolve back into it."},
  {"id":"cho-018-001","c":"chopin","coll":"Waltzes","title":"Waltz in E♭ major","sub":"Op. 18","key":"E♭ major","level":5,"year":1833,"dur":3,"story":"Chopin's first published waltz, the 'Grande valse brillante' — pure Parisian ballroom glitter, a swirl of entrances and flourishes written not for real dancing but for the imagination."},
  {"id":"cho-025-001","c":"chopin","coll":"Études, Op. 25","title":"Étude in A♭ major (Aeolian Harp)","sub":"Op. 25 No. 1","key":"A♭ major","level":9,"year":1837,"dur":2.5,"story":"The 'Aeolian Harp' (or 'Shepherd Boy') étude — a shimmering wash of arpeggios out of which a singing melody rises on top. Schumann said hearing Chopin play it was like watching an Aeolian harp sound in the wind."},
  {"id":"cho-025-002","c":"chopin","coll":"Études, Op. 25","title":"Étude in F minor","sub":"Op. 25 No. 2","key":"F minor","level":8,"year":1837,"dur":1.5,"story":"A soft, murmuring perpetuum mobile — triplets in the right hand cross against duplets in the left, so gently blurred that the whole piece seems to hover and drift. Marked to be played 'as softly as possible.'"},
  {"id":"cho-025-003","c":"chopin","coll":"Études, Op. 25","title":"Étude in F major","sub":"Op. 25 No. 3","key":"F major","level":8,"year":1837,"dur":1.5,"story":"A springy, galloping study in leaps and staccato — both hands snap out the same jaunty rhythmic figure, light and full of wit."},
  {"id":"cho-025-004","c":"chopin","coll":"Études, Op. 25","title":"Étude in A minor","sub":"Op. 25 No. 4","key":"A minor","level":8,"year":1837,"dur":1.5,"story":"A study in leaping staccato chords over an off-beat bass — restless and slightly anxious, the hand snapping between registers."},
  {"id":"cho-025-005","c":"chopin","coll":"Études, Op. 25","title":"Étude in E minor (Wrong Note)","sub":"Op. 25 No. 5","key":"E minor","level":8,"year":1837,"dur":3.5,"story":"Nicknamed 'Wrong Note' for the biting minor-second clashes of its skittish outer sections — but at its centre lies one of Chopin's most beautiful long-breathed melodies, in radiant E major."},
  {"id":"cho-025-006","c":"chopin","coll":"Études, Op. 25","title":"Étude in G♯ minor (Thirds)","sub":"Op. 25 No. 6","key":"G♯ minor","level":10,"year":1837,"dur":2,"story":"The legendary 'Thirds' étude — the right hand runs continuous chromatic scales in parallel thirds, one of the hardest feats in the repertoire. Chopin dispatches it as if it were nothing."},
  {"id":"cho-025-007","c":"chopin","coll":"Études, Op. 25","title":"Étude in C♯ minor","sub":"Op. 25 No. 7","key":"C♯ minor","level":7,"year":1837,"dur":5.5,"story":"The 'Cello' étude — a study not in speed but in tone and phrasing, built as a duet between a rich bass melody and a soprano line, like a Bellini aria for two voices."},
  {"id":"cho-025-008","c":"chopin","coll":"Études, Op. 25","title":"Étude in D♭ major (Sixths)","sub":"Op. 25 No. 8","key":"D♭ major","level":9,"year":1837,"dur":1,"story":"A luminous study in double sixths — both hands glide in parallel sixths at speed. Brief, warm and dazzling, it's a favourite among pianists for its sheer sound."},
  {"id":"cho-025-009","c":"chopin","coll":"Études, Op. 25","title":"Étude in G♭ major (Butterfly)","sub":"Op. 25 No. 9","key":"G♭ major","level":7,"year":1837,"dur":1,"story":"The 'Butterfly' étude — light, fluttering leaps in the right hand flit by in under a minute. Playful and fleeting, one of Chopin's most charming miniatures."},
  {"id":"cho-025-010","c":"chopin","coll":"Études, Op. 25","title":"Étude in B minor (Octaves)","sub":"Op. 25 No. 10","key":"B minor","level":10,"year":1837,"dur":4.5,"story":"A ferocious study in continuous octaves that frames a tender, songful B-major middle section. The contrast between its stormy outer storms and serene centre makes it one of the most dramatic of all the études."},
  {"id":"cho-025-011","c":"chopin","coll":"Études, Op. 25","title":"Étude in A minor (Winter Wind)","sub":"Op. 25 No. 11","key":"A minor","level":9,"year":1837,"dur":2.5,"story":"The 'Winter Wind' — after a deceptively quiet four-bar opening, a storm of chromatic right-hand figuration howls over a defiant march in the left. One of the most fearsome études in the repertoire."},
  {"id":"cho-025-012","c":"chopin","coll":"Études, Op. 25","title":"Étude in C minor (Ocean)","sub":"Op. 25 No. 12","key":"C minor","level":9,"year":1837,"dur":2.5,"story":"The 'Ocean' étude that closes Op. 25 — great surging arpeggios roll through both hands like breaking waves, building to a heroic, sea-swept finish."},
  {"id":"cho-026-001","c":"chopin","coll":"Polonaises","title":"Polonaise in C♯ minor","sub":"Op. 26 No. 1","key":"C♯ minor","level":7,"year":1835,"dur":6,"story":"The first of Chopin's mature polonaises — brooding and proud, its stern march framing a tender lyrical trio. Here the polonaise becomes not a dance but a statement of national feeling."},
  {"id":"cho-027-001","c":"chopin","coll":"Nocturnes","title":"Nocturne in C♯ minor","sub":"Op. 27 No. 1","key":"C♯ minor","level":6,"year":1836,"dur":5,"story":"A nocturne of shadow and unrest — a hushed, mysterious outer song surrounds a surging, impassioned middle. Its companion in D-flat is more famous, but this darker C-sharp minor twin is among his finest."},
  {"id":"cho-028-001","c":"chopin","coll":"24 Préludes, Op. 28","title":"Prélude in C major","sub":"Op. 28 No. 1","key":"C major","level":4,"year":1839,"dur":0.75,"story":"The opening of the 24 Préludes — a brief, breathless Agitato in C major that sets the cycle in motion, its restless right-hand figure echoing the first prélude of Bach's Well-Tempered Clavier."},
  {"id":"cho-028-002","c":"chopin","coll":"24 Préludes, Op. 28","title":"Prélude in A minor","sub":"Op. 28 No. 2","key":"A minor","level":4,"year":1839,"dur":1.5,"story":"One of the strangest of the 24 Préludes — a bleak, crawling left hand wanders through keys that barely seem to belong together, the right hand sighing above. Unsettling and decades ahead of its time."},
  {"id":"cho-028-003","c":"chopin","coll":"24 Préludes, Op. 28","title":"Prélude in G major","sub":"Op. 28 No. 3","key":"G major","level":4,"year":1839,"dur":1.5,"story":"A prélude of pure spring — a rippling, feather-light left-hand current runs unbroken beneath a carefree melody, one of the sunniest pages in the set."},
  {"id":"cho-028-005","c":"chopin","coll":"24 Préludes, Op. 28","title":"Prélude in D major","sub":"Op. 28 No. 5","key":"D major","level":4,"year":1839,"dur":1.5,"story":"A tiny, iridescent prélude — barely a minute of shifting, slippery harmony that glitters past almost before you can catch it."},
  {"id":"cho-028-008","c":"chopin","coll":"24 Préludes, Op. 28","title":"Prélude in F♯ minor","sub":"Op. 28 No. 8","key":"F♯ minor","level":4,"year":1839,"dur":1.5,"story":"A turbulent prélude in which a passionate inner melody is half-hidden inside a shimmer of restless right-hand filigree — grand emotion packed into a small frame."},
  {"id":"cho-028-009","c":"chopin","coll":"24 Préludes, Op. 28","title":"Prélude in E major","sub":"Op. 28 No. 9","key":"E major","level":4,"year":1839,"dur":1.5,"story":"The shortest yet grandest of the préludes — just twelve bars of solemn, hymn-like chords that swell to an almost orchestral majesty. A whole cathedral in miniature."},
  {"id":"cho-028-010","c":"chopin","coll":"24 Préludes, Op. 28","title":"Prélude in C♯ minor","sub":"Op. 28 No. 10","key":"C♯ minor","level":4,"year":1839,"dur":1.5,"story":"A quicksilver prélude — darting downward flurries are answered by delicate, courtly little figures, like a question tossed off and lightly brushed aside."},
  {"id":"cho-028-011","c":"chopin","coll":"24 Préludes, Op. 28","title":"Prélude in B major","sub":"Op. 28 No. 11","key":"B major","level":4,"year":1839,"dur":1.5,"story":"A gentle, lilting prélude that seems to skip along on tiptoe — brief, graceful, and gone in a moment."},
  {"id":"cho-028-012","c":"chopin","coll":"24 Préludes, Op. 28","title":"Prélude in G♯ minor","sub":"Op. 28 No. 12","key":"G♯ minor","level":4,"year":1839,"dur":1.5,"story":"A driving, agitated prélude — insistent repeated chords and a restless pulse make it one of the stormier miniatures of the set."},
  {"id":"cho-028-013","c":"chopin","coll":"24 Préludes, Op. 28","title":"Prélude in F♯ major","sub":"Op. 28 No. 13","key":"F♯ major","level":4,"year":1839,"dur":1.5,"story":"A serene, nocturne-like prélude in radiant F-sharp major, its flowing song opening into a hushed, timeless 'più lento' middle before returning to rest."},
  {"id":"cho-028-014","c":"chopin","coll":"24 Préludes, Op. 28","title":"Prélude in E♭ minor","sub":"Op. 28 No. 14","key":"E♭ minor","level":4,"year":1839,"dur":1.5,"story":"A dark, stormy prélude of heavy unison triplets rumbling in both hands — a bleak cousin to the finale of Chopin's own B-flat minor Sonata."},
  {"id":"cho-028-016","c":"chopin","coll":"24 Préludes, Op. 28","title":"Prélude in B♭ minor","sub":"Op. 28 No. 16","key":"B♭ minor","level":4,"year":1839,"dur":1.5,"story":"The fiercest of the préludes — after a single dramatic chord, a furious presto tears down the keyboard over a galloping bass. Sometimes nicknamed 'Hades.'"},
  {"id":"cho-028-017","c":"chopin","coll":"24 Préludes, Op. 28","title":"Prélude in A♭ major","sub":"Op. 28 No. 17","key":"A♭ major","level":4,"year":1839,"dur":1.5,"story":"A warm, song-like prélude of great tenderness that ends with a low A-flat tolling eleven times in the bass, like a distant bell fading into the night."},
  {"id":"cho-028-018","c":"chopin","coll":"24 Préludes, Op. 28","title":"Prélude in F minor","sub":"Op. 28 No. 18","key":"F minor","level":4,"year":1839,"dur":1.5,"story":"A prélude of operatic drama — bare, recitative-like declamations hurl themselves upward and crash down in fistfuls of chords. Anger and defiance in miniature."},
  {"id":"cho-028-019","c":"chopin","coll":"24 Préludes, Op. 28","title":"Prélude in E♭ major","sub":"Op. 28 No. 19","key":"E♭ major","level":4,"year":1839,"dur":1.5,"story":"A prélude of pure flight — a rapid, weaving current in both hands rushes joyfully forward without pause, exhilarating and airborne."},
  {"id":"cho-028-021","c":"chopin","coll":"24 Préludes, Op. 28","title":"Prélude in B♭ major","sub":"Op. 28 No. 21","key":"B♭ major","level":4,"year":1839,"dur":1.5,"story":"A lyrical prélude in which a long, tender melody floats over a gently shifting, restless accompaniment that keeps sliding into unexpected colors."},
  {"id":"cho-028-022","c":"chopin","coll":"24 Préludes, Op. 28","title":"Prélude in G minor","sub":"Op. 28 No. 22","key":"G minor","level":4,"year":1839,"dur":1.5,"story":"A short burst of fury — angry octaves and a powerful, defiant bass make this one of the most muscular of the préludes."},
  {"id":"cho-028-023","c":"chopin","coll":"24 Préludes, Op. 28","title":"Prélude in F major","sub":"Op. 28 No. 23","key":"F major","level":4,"year":1839,"dur":1.5,"story":"A delicate, watery prélude that trickles past like a stream — and closes on a mysterious, unresolved added seventh, leaving the ear hanging."},
  {"id":"cho-028-024","c":"chopin","coll":"24 Préludes, Op. 28","title":"Prélude in D minor","sub":"Op. 28 No. 24","key":"D minor","level":4,"year":1839,"dur":1.5,"story":"The stormy finale of the set — a defiant melody rides a churning left-hand ostinato in D minor, ending with three cataclysmic low D's that slam the door on the whole cycle."},
  {"id":"cho-031-001","c":"chopin","coll":"Scherzos","title":"Scherzo No. 2 in B♭ minor","sub":"Op. 31","key":"B♭ minor","level":10,"year":1837,"dur":9,"story":"The famous Second Scherzo — a hushed, questioning triplet murmur is answered by a blazing fortissimo outburst, launching one of Chopin's most beloved and dramatic showpieces, with a soaring, tender central song."},
  {"id":"cho-034-002","c":"chopin","coll":"Waltzes","title":"Waltz in A minor","sub":"Op. 34 No. 2","key":"A minor","level":5,"year":1838,"dur":3,"story":"The waltz that isn't brilliant — despite its 'valse brillante' label this one is wistful and minor-key, a melancholy that Chopin reportedly loved best among his waltzes."},
  {"id":"cho-034-001","c":"chopin","coll":"Waltzes","title":"Waltz in A♭ major (Grande valse brillante)","sub":"Op. 34 No. 1","key":"A♭ major","level":7,"year":1835,"dur":5.5,"story":"The dazzling 'Grande valse brillante' — a glittering ballroom whirl with a flourishing introduction and cascading runs, the very image of elegant salon Chopin."},
  {"id":"cho-034-003","c":"chopin","coll":"Waltzes","title":"Waltz in F major","sub":"Op. 34 No. 3","key":"F major","level":6,"year":1838,"dur":2.5,"story":"A bright, spinning waltz nicknamed 'the cat waltz' for its scampering runs — light, quick and playful."},
  {"id":"cho-048-002","c":"chopin","coll":"Nocturnes","title":"Nocturne in F♯ minor","sub":"Op. 48 No. 2","key":"F♯ minor","level":8,"year":1841,"dur":6.5,"story":"A serene, songful nocturne with a recitative-like central section, marked to be played as if speaking. The gentler companion to the famous C-minor Op. 48 No. 1."},
  {"id":"cho-055-002","c":"chopin","coll":"Nocturnes","title":"Nocturne in E♭ major","sub":"Op. 55 No. 2","key":"E♭ major","level":8,"year":1844,"dur":5,"story":"A late nocturne of continuous, interweaving song — two melodic lines float and entwine over rolling harmony in one long, seamless breath."},
  {"id":"cho-062-002","c":"chopin","coll":"Nocturnes","title":"Nocturne in E major","sub":"Op. 62 No. 2","key":"E major","level":8,"year":1846,"dur":6,"story":"One of Chopin's last nocturnes — a tranquil outer song frames an agitated, contrapuntal middle, the late style at its most refined and searching."},
  {"id":"cho-026-002","c":"chopin","coll":"Polonaises","title":"Polonaise in E♭ minor","sub":"Op. 26 No. 2","key":"E♭ minor","level":9,"year":1836,"dur":7.5,"story":"A dark, brooding polonaise nicknamed 'Revolt' or 'Siberian' — ominous and dramatic, far from the heroic display of the later polonaises."},
  {"id":"cho-036-001","c":"chopin","coll":"Impromptus","title":"Impromptu in F♯ major","sub":"Op. 36","key":"F♯ major","level":7,"year":1835,"dur":4.5,"story":"The Second Impromptu — the most freely improvisatory of the four, drifting through unexpected keys and textures as if being invented on the spot."},
  {"id":"cho-038-001","c":"chopin","coll":"Ballades","title":"Ballade No. 2 in F major","sub":"Op. 38","key":"F major","level":9,"year":1839,"dur":9,"story":"The Second Ballade — a serene pastoral (a gentle siciliano) is twice shattered by a furious presto storm. Dedicated to Schumann, it ends not where it began but darkly in A minor."},
  {"id":"cho-039-001","c":"chopin","coll":"Scherzos","title":"Scherzo No. 3 in C♯ minor","sub":"Op. 39","key":"C♯ minor","level":10,"year":1839,"dur":9,"story":"The Third Scherzo — the most architectural of the four, its stern cascading octaves and a solemn chorale answered each time by a shower of delicate, harp-like filigree."},
  {"id":"cho-040-001","c":"chopin","coll":"Polonaises","title":"Polonaise in A major (Military)","sub":"Op. 40 No. 1","key":"A major","level":7,"year":1838,"dur":6,"story":"The 'Military' Polonaise — bold, bright and martial, its proud tramping rhythm became an emblem of Polish resilience. One of Chopin's most instantly recognizable pieces."},
  {"id":"cho-042-001","c":"chopin","coll":"Waltzes","title":"Waltz in A♭ major","sub":"Op. 42","key":"A♭ major","level":5,"year":1840,"dur":3,"story":"Among the finest of the waltzes — sophisticated and swirling, it famously plays a singing two-beat melody against a three-beat spin, so two waltzes seem to turn at once."},
  {"id":"cho-045-001","c":"chopin","coll":"Preludes","title":"Prélude in C♯ minor","sub":"Op. 45","key":"C♯ minor","level":4,"year":1841,"dur":1.5,"story":"A standalone prélude written years after the Op. 28 set — dreamy and harmonically adventurous, it wanders far afield before a written-out cadenza dissolves it into stillness."},
  {"id":"cho-047-001","c":"chopin","coll":"Ballades","title":"Ballade No. 3 in A♭ major","sub":"Op. 47","key":"A♭ major","level":9,"year":1841,"dur":9,"story":"The sunniest of the ballades — buoyant and graceful, built on a lilting, rocking theme that keeps returning transformed, ending in a burst of A-flat major radiance."},
  {"id":"cho-048-001","c":"chopin","coll":"Nocturnes","title":"Nocturne in C minor","sub":"Op. 48 No. 1","key":"C minor","level":6,"year":1841,"dur":5,"story":"The grandest of all the nocturnes — a solemn, processional song gives way to a chorale that swells, doubled in octaves, into one of the most passionate climaxes Chopin ever wrote."},
  {"id":"cho-052-001","c":"chopin","coll":"Ballades","title":"Ballade No. 4 in F minor","sub":"Op. 52","key":"F minor","level":9,"year":1842,"dur":9,"story":"The Fourth Ballade — for many Chopin's supreme masterpiece, weaving variation and counterpoint into an ever-deepening narrative that culminates in one of the most shattering codas in all piano music."},
  {"id":"cho-053-001","c":"chopin","coll":"Polonaises","title":"Polonaise in A♭ major (Heroic)","sub":"Op. 53","key":"A♭ major","level":7,"year":1842,"dur":6,"story":"The 'Heroic' Polonaise — its central trio, with those famous descending left-hand octaves hammering like distant cavalry, made it a triumphant symbol of Poland and one of the most iconic works ever written for piano."},
  {"id":"cho-054-001","c":"chopin","coll":"Scherzos","title":"Scherzo No. 4 in E major","sub":"Op. 54","key":"E major","level":10,"year":1842,"dur":9,"story":"The Fourth Scherzo — the only one in a major key, and the sunniest: light, quicksilver and playful, framing a warm, songful central trio."},
  {"id":"cho-055-001","c":"chopin","coll":"Nocturnes","title":"Nocturne in F minor","sub":"Op. 55 No. 1","key":"F minor","level":6,"year":1843,"dur":5,"story":"A nocturne of quiet resignation — a plaintive melody walks over a steady bass, gathering into an agitated climax before dissolving into a flowing, consoling coda."},
  {"id":"cho-057-001","c":"chopin","coll":"Berceuses","title":"Berceuse in D♭ major","sub":"Op. 57","key":"D♭ major","level":5,"year":1844,"dur":4,"story":"The Berceuse — a cradle-song built over a single rocking left-hand pattern that never changes, while above it the right hand spins ever more delicate, glittering variations. Hypnotic and utterly serene."},
  {"id":"cho-060-001","c":"chopin","coll":"Barcarolles","title":"Barcarolle in F♯ major","sub":"Op. 60","key":"F♯ major","level":8,"year":1846,"dur":8,"story":"The Barcarolle — a Venetian gondolier's song in swaying 12/8, and one of Chopin's supreme late works: rich, sensuous and expansive, its two voices entwining like lovers over the lapping water."},
  {"id":"cho-035-001","c":"chopin","coll":"Piano Sonatas","title":"Piano Sonata No. 2 (Funeral March)","sub":"Op. 35","key":"B♭ minor","level":11,"year":1839,"dur":23,"story":"The 'Funeral March' Sonata — its third movement is the most famous funeral march ever written. Around it Chopin builds a stormy first movement, a driving scherzo, and a spectral unison finale that whispers past in barely a minute, 'wind over the graves.'"},
  {"id":"cho-058-001","c":"chopin","coll":"Piano Sonatas","title":"Piano Sonata No. 3","sub":"Op. 58","key":"B minor","level":11,"year":1844,"dur":27,"story":"Chopin's grandest sonata — a majestic first movement, a quicksilver scherzo, a deeply songful Largo, and a thrilling rondo finale that gallops to a blazing close. One of the summits of the Romantic sonata."},
  {"id":"cho-029-001","c":"chopin","coll":"Impromptus","title":"Impromptu No. 1","sub":"Op. 29","key":"A♭ major","level":8,"year":1837,"dur":4,"story":"A bubbling, effervescent impromptu — rippling triplets frame a warm, singing middle section. Effortless charm that conceals real difficulty."},
  {"id":"cho-051-001","c":"chopin","coll":"Impromptus","title":"Impromptu No. 3","sub":"Op. 51","key":"G♭ major","level":9,"year":1843,"dur":5,"story":"The most elusive of the impromptus — shifting, chromatic and harmonically restless, its flowing lines veiled in a late-Chopin twilight."},
  {"id":"cho-049-001","c":"chopin","title":"Fantaisie in F minor","sub":"Op. 49","key":"F minor","level":11,"year":1841,"dur":13,"story":"One of Chopin's greatest large-scale works — a solemn march opens onto a sweeping drama of heroic themes, a hymn-like central interlude, and a triumphant close. Epic, improvisatory and grand."},
  {"id":"cho-061-001","c":"chopin","coll":"Polonaises","title":"Polonaise-Fantaisie","sub":"Op. 61","key":"A♭ major","level":11,"year":1846,"dur":13,"story":"A visionary late masterpiece that dissolves the polonaise into free fantasy — searching, harmonically bold, and transcendent, ending in a blaze of affirmation. Chopin at his most forward-looking."},
  {"id":"cho-022-001","c":"chopin","title":"Andante spianato et Grande polonaise brillante","sub":"Op. 22","key":"G major","level":10,"year":1834,"dur":14,"story":"A serene, songful Andante spianato ('smooth') flows into a glittering, festive polonaise — brilliant salon Chopin at its most elegant and virtuosic."},
  {"id":"cho-044-001","c":"chopin","coll":"Polonaises","title":"Polonaise in F♯ minor","sub":"Op. 44","key":"F♯ minor","level":10,"year":1841,"dur":10,"story":"A fierce, martial polonaise of relentless power, framing an unexpected mazurka at its heart — one of Chopin's darkest and most original dances."},
  {"id":"cho-015-001","c":"chopin","coll":"Nocturnes","title":"Nocturne in F major","sub":"Op. 15 No. 1","key":"F major","level":6,"year":1833,"dur":5,"story":"A serene, singing nocturne whose calm outer sections frame a stormy, agitated middle — 'con fuoco' — that erupts and then subsides back into peace."},
  {"id":"cho-015-002","c":"chopin","coll":"Nocturnes","title":"Nocturne in F♯ major","sub":"Op. 15 No. 2","key":"F♯ major","level":7,"year":1833,"dur":3.5,"story":"One of the most exquisite nocturnes — a languid, richly ornamented melody floats above gently rocking harmony, with a quicker, shimmering central 'doppio movimento.'"},
  {"id":"cho-015-003","c":"chopin","coll":"Nocturnes","title":"Nocturne in G minor","sub":"Op. 15 No. 3","key":"G minor","level":6,"year":1833,"dur":4,"story":"A wistful, questioning nocturne marked 'languido e rubato,' drifting to an unexpected chorale-like close. Chopin reportedly noted it was written 'after a performance of Hamlet.'"},
  {"id":"cho-069-001","c":"chopin","coll":"Waltzes","title":"Waltz in A♭ major (L'adieu)","sub":"Op. 69 No. 1","key":"A♭ major","level":6,"year":1835,"dur":3.5,"story":"'The Farewell' waltz — tender and nostalgic, written for Maria Wodzińska as Chopin left her. Published after his death, it's one of his most beloved and touching waltzes."},
  {"id":"cho-069-002","c":"chopin","coll":"Waltzes","title":"Waltz in B minor","sub":"Op. 69 No. 2","key":"B minor","level":5,"year":1829,"dur":3.5,"story":"A melancholy, swaying waltz in B minor with a brighter major interlude — wistful salon Chopin, an early piece published posthumously."},
  {"id":"cho-024-001","c":"chopin","coll":"Mazurkas","title":"Mazurka in G minor","sub":"Op. 24 No. 1","key":"G minor","level":5,"year":1835,"dur":2.5,"story":"A gentle, plaintive mazurka, 'lento' and rubato, its drooping folk melody swaying with quiet melancholy."},
  {"id":"cho-024-002","c":"chopin","coll":"Mazurkas","title":"Mazurka in C major","sub":"Op. 24 No. 2","key":"C major","level":5,"year":1835,"dur":2.5,"story":"A bright, rustic mazurka evoking village bagpipes and drones — earthy and cheerful, with sudden shifts of colour."},
  {"id":"cho-024-003","c":"chopin","coll":"Mazurkas","title":"Mazurka in A♭ major","sub":"Op. 24 No. 3","key":"A♭ major","level":4,"year":1835,"dur":2,"story":"A short, elegant mazurka, graceful and lightly perfumed — salon dance at its most charming."},
  {"id":"cho-024-004","c":"chopin","coll":"Mazurkas","title":"Mazurka in B♭ minor","sub":"Op. 24 No. 4","key":"B♭ minor","level":7,"year":1835,"dur":4.5,"story":"The grandest of the set — an extended, richly developed mazurka of shifting moods, from brooding melancholy to sweeping lyricism, ending in a haze."},
  {"id":"cho-033-001","c":"chopin","coll":"Mazurkas","title":"Mazurka in G♯ minor","sub":"Op. 33 No. 1","key":"G♯ minor","level":5,"year":1838,"dur":2,"story":"A sombre, 'mesto' mazurka — spare and grieving, one of Chopin's most concentrated miniatures."},
  {"id":"cho-033-002","c":"chopin","coll":"Mazurkas","title":"Mazurka in D major","sub":"Op. 33 No. 2","key":"D major","level":5,"year":1838,"dur":2.5,"story":"The most popular of the set — a spirited, whirling 'vivace' dance, bright and irresistibly toe-tapping."},
  {"id":"cho-033-003","c":"chopin","coll":"Mazurkas","title":"Mazurka in C major","sub":"Op. 33 No. 3","key":"C major","level":4,"year":1838,"dur":1.5,"story":"A brief, 'semplice' mazurka — simple, songful and folk-like, gone in a moment."},
  {"id":"cho-033-004","c":"chopin","coll":"Mazurkas","title":"Mazurka in B minor","sub":"Op. 33 No. 4","key":"B minor","level":7,"year":1838,"dur":5.5,"story":"A large, ballade-like mazurka — the longest Chopin wrote — weaving several themes into a sweeping, story-telling dance."},
  {"id":"cho-062-001","c":"chopin","coll":"Nocturnes","title":"Nocturne in B major","sub":"Op. 62 No. 1","key":"B major","level":6,"year":1846,"dur":5,"story":"A serene late nocturne — its reprise famously dissolves the main melody into a shimmer of trills, a moment of rarefied, almost otherworldly refinement."},
  {"id":"cho-063-003","c":"chopin","coll":"Mazurkas","title":"Mazurka in C♯ minor","sub":"Op. 63 No. 3","key":"C♯ minor","level":4,"year":1846,"dur":3,"story":"One of the last mazurkas Chopin published — elegant and waltz-like, it closes with a graceful canon, the melody chasing itself in a final, tender farewell to the dance he loved most."},
  {"id":"cho-064-002","c":"chopin","coll":"Waltzes","title":"Waltz in C♯ minor","sub":"Op. 64 No. 2","key":"C♯ minor","level":5,"year":1847,"dur":3,"story":"The wistful, restless companion to the 'Minute' Waltz — its melancholy main theme keeps yielding to a faster, whirling section, a bittersweet push-and-pull that has made it one of his best-loved waltzes."},
  {"id":"deb-clair","c":"debussy","title":"Clair de Lune","sub":"Suite bergamasque","key":"D♭ major","level":7,"year":1905,"dur":5,"story":"'Moonlight', the third movement of the Suite bergamasque, named after a Verlaine poem. Its washes of sound demand the subtlest half-pedalling in the repertoire."},
  {"id":"deb-arab1","c":"debussy","coll":"Arabesques, L. 66","title":"No. 1","key":"E major","level":5,"year":1891,"dur":4,"story":"An early work already full of Debussy's fingerprints — flowing triplets, gently oscillating harmony, and cross-rhythms that must sound effortless.\n\nThe two Arabesques were the first piano music Debussy ever got into print. He signed the contract in April 1891 and was paid 200 francs for the pair, which appeared that November in a run of just 300 copies. Fame came slowly — only about 1,200 copies of each sold over the next twelve years — before they grew into some of his most beloved and most-played works."},
  {"id":"deb-reverie","c":"debussy","title":"Rêverie","sub":"L. 68","key":"F major","level":5,"year":1890,"dur":4.5,"story":"Debussy later dismissed this dreamy miniature as a youthful work of 'no consequence', but the public disagreed — it remains one of his most-played pieces."},
  {"id":"deb-petit-negre","c":"debussy","title":"Le petit nègre","sub":"L. 114","key":"C major","level":3,"year":1909,"dur":1.5,"story":"'The Little Nigar' — a bright, syncopated cakewalk in the spirit of Golliwogg's Cake-walk, written as an easy teaching piece. Jaunty, jazzy and charming."},
  {"id":"deb-bruyeres","c":"debussy","coll":"Préludes, Book 2","title":"Bruyères","key":"A♭ major","level":5,"year":1913,"dur":3,"story":"'Heather' — the fifth prelude of Book 2 (1913). A serene pastoral in A♭ major, its gentle pentatonic melody drifting over rolling moorland; one of the calmest, most consonant pages Debussy ever wrote, a cousin to 'The Girl with the Flaxen Hair.'"},
  {"id":"deb-ballade","c":"debussy","title":"Ballade","sub":"L. 70","key":"F major","level":6,"year":1890,"dur":6,"story":"An early salon piece from 1890 (lightly revised in 1903), first published as 'Ballade slave.' Flowing and songful, it catches the young Debussy midway between Massenet's charm and the harmonic colour that would soon become his own."},
  {"id":"deb-danse","c":"debussy","title":"Danse","sub":"L. 69","key":"A major","level":6,"year":1890,"dur":5,"story":"Also known as 'Tarantelle styrienne' (1890) — an exuberant early dance that whirls along in a tarantella rhythm, bright with youthful high spirits and the modal colour Debussy would later make his signature. Ravel liked it enough to orchestrate it in 1922."},
  {"id":"deb-flaxen","c":"debussy","title":"The Girl with the Flaxen Hair","sub":"Préludes 1","key":"G♭ major","level":4,"year":1910,"dur":2.5,"story":"A prelude of pure serenity built on pentatonic melody. Its quietness is deceptive: balancing the chords so the tune floats on top is the whole art of it."},
  {"id":"deb-gradus","c":"debussy","title":"Doctor Gradus ad Parnassum","sub":"Children's Corner","key":"C major","level":6,"year":1908,"dur":2,"story":"A gentle parody of dry Czerny exercises, written for his daughter 'Chouchou'. Behind the joke is a genuine study in even, glassy finger-work."},
  {"id":"lis-liebe3","c":"liszt","title":"Liebestraum No. 3","sub":"S. 541","key":"A♭ major","level":8,"year":1850,"dur":4.5,"story":"'Dream of Love' — originally a song about love that endures beyond death. The melody is passed between the hands and crowned by two famous cadenzas."},
  {"id":"lis-campanella","c":"liszt","title":"La Campanella","sub":"S. 141 No. 3","key":"G♯ minor","level":11,"year":1851,"dur":5,"story":"'The Little Bell', after a Paganini theme. Its enormous right-hand leaps and repeated notes make it one of the most fearsome showpieces ever written."},
  {"id":"lis-consol3","c":"liszt","title":"Consolation No. 3","sub":"S. 172","key":"D♭ major","level":5,"year":1850,"dur":4,"story":"The gentlest of Liszt's six Consolations, clearly modelled on a Chopin nocturne. A rare moment of pure repose from the great virtuoso."},
  {"id":"sat-gym1","c":"satie","title":"Gymnopédie No. 1","sub":"","key":"D major","level":3,"year":1888,"dur":3.5,"story":"Three slow, spare dances that were decades ahead of their time. The floating dissonances and steady pulse make it a study in patience and evenness of touch."},
  {"id":"sat-gnoss1","c":"satie","title":"Gnossienne No. 1","sub":"","key":"F minor","level":4,"year":1890,"dur":4,"story":"Written without bar-lines and sprinkled with cryptic instructions like 'wonder about yourself'. Its modal, vaguely Eastern melody drifts free of any regular metre."},
  {"id":"schubert-g10","c":"schubert","coll":"Impromptus","title":"Impromptu in G♭ major","sub":"Op. 90 No. 3","key":"G♭ major","level":7,"year":1827,"dur":6,"story":"One of Schubert's most beloved impromptus — a long, songful melody floats over a rippling accompaniment, serene and endless as a slow river."},
  {"id":"schubert-g11","c":"schubert","coll":"Impromptus","title":"Impromptu in A♭ major","sub":"Op. 90 No. 4","key":"A♭ major","level":7,"year":1827,"dur":7,"story":"An impromptu of cascading, glassy arpeggios that suddenly darken into a passionate C-sharp minor storm before the sunlight returns."},
  {"id":"schubert-g12","c":"schubert","coll":"Impromptus","title":"Impromptu in B♭ major","sub":"Op. 142 No. 3","key":"B♭ major","level":6,"year":1827,"dur":11,"story":"A gentle theme — borrowed from his own Rosamunde music — followed by five graceful variations, tender, playful, and touched with shadow."},
  {"id":"schubert-g13","c":"schubert","coll":"Moments musicaux","title":"Moment musical No. 3","sub":"Op. 94","key":"F minor","level":4,"year":1828,"dur":2,"story":"The most popular of the Moments musicaux — a light, dancing 'Air russe' with an irresistible skip in its step."},
  {"id":"schubert-d960-1","c":"schubert","coll":"Piano Sonata in B♭ major, D. 960","title":"Molto moderato","sub":"I","key":"B♭ major","level":9,"year":1828,"dur":20,"story":"The vast, serene opening of Schubert's final sonata — its heavenly melody shadowed by a mysterious rumbling trill deep in the bass."},
  {"id":"schubert-d960-2","c":"schubert","coll":"Piano Sonata in B♭ major, D. 960","title":"Andante sostenuto","sub":"II","key":"C♯ minor","level":8,"year":1828,"dur":9,"story":"A profound, still slow movement of aching stillness, framing a consoling major-key middle."},
  {"id":"schubert-d960-3","c":"schubert","coll":"Piano Sonata in B♭ major, D. 960","title":"Scherzo: Allegro vivace con delicatezza","sub":"III","key":"B♭ major","level":8,"year":1828,"dur":4,"story":"A light, delicate scherzo dancing above the depths, with a shadowed minor trio."},
  {"id":"schubert-d960-4","c":"schubert","coll":"Piano Sonata in B♭ major, D. 960","title":"Allegro ma non troppo","sub":"IV","key":"B♭ major","level":9,"year":1828,"dur":8,"story":"A songful, questioning finale launched by a lone repeated octave, sweeping to a joyful close."},
  {"id":"schubert-wand-1","c":"schubert","coll":"Wanderer Fantasy, D. 760","title":"Allegro con fuoco ma non troppo","sub":"I","key":"C major","level":10,"year":1822,"dur":6,"story":"A blazing opening whose dotted rhythm comes straight from Schubert's song 'Der Wanderer'."},
  {"id":"schubert-wand-2","c":"schubert","coll":"Wanderer Fantasy, D. 760","title":"Adagio","sub":"II","key":"C♯ minor","level":9,"year":1822,"dur":6,"story":"The 'Wanderer' song theme itself, stated and darkly varied."},
  {"id":"schubert-wand-3","c":"schubert","coll":"Wanderer Fantasy, D. 760","title":"Presto","sub":"III","key":"A♭ major","level":10,"year":1822,"dur":5,"story":"A driving scherzo spun from the same theme."},
  {"id":"schubert-wand-4","c":"schubert","coll":"Wanderer Fantasy, D. 760","title":"Allegro","sub":"IV","key":"C major","level":10,"year":1822,"dur":4,"story":"A grand fugal finale that crowns the whole fantasy."},
  {"id":"schubert-op90-1","c":"schubert","coll":"Impromptus","title":"Impromptu in C minor","sub":"Op. 90 No. 1","key":"C minor","level":7,"year":1827,"dur":9,"story":"A restless C-minor march that grows from a single bare octave into a sweeping, dramatic song."},
  {"id":"schubert-op90-2","c":"schubert","coll":"Impromptus","title":"Impromptu in E♭ major","sub":"Op. 90 No. 2","key":"E♭ major","level":7,"year":1827,"dur":5,"story":"A whirling triplet study that races up and down the keyboard, framing a stamping minor-key trio."},
  {"id":"schubert-op142-1","c":"schubert","coll":"Impromptus","title":"Impromptu in F minor","sub":"Op. 142 No. 1","key":"F minor","level":8,"year":1827,"dur":11,"story":"The largest of the impromptus — a dramatic, sonata-like F-minor movement of sweep and pathos."},
  {"id":"schubert-op142-2","c":"schubert","coll":"Impromptus","title":"Impromptu in A♭ major","sub":"Op. 142 No. 2","key":"A♭ major","level":6,"year":1827,"dur":6,"story":"A serene, hymn-like Allegretto with a gently rippling trio — one of Schubert's most beloved miniatures."},
  {"id":"schubert-op142-4","c":"schubert","coll":"Impromptus","title":"Impromptu in F minor","sub":"Op. 142 No. 4","key":"F minor","level":8,"year":1827,"dur":7,"story":"A fiery Hungarian-flavored finale full of scampering runs and sudden dynamic surprises."},
  {"id":"schubert-mm-1","c":"schubert","coll":"Moments musicaux","title":"Moment musical No. 1","sub":"Op. 94","key":"C major","level":6,"year":1828,"dur":5,"story":"A genial, songful Moderato that ambles along with easy Viennese charm."},
  {"id":"schubert-mm-2","c":"schubert","coll":"Moments musicaux","title":"Moment musical No. 2","sub":"Op. 94","key":"A♭ major","level":6,"year":1828,"dur":7,"story":"A tender, sighing Andantino whose serene refrain is shadowed by darker, aching episodes."},
  {"id":"schubert-mm-4","c":"schubert","coll":"Moments musicaux","title":"Moment musical No. 4","sub":"Op. 94","key":"C♯ minor","level":6,"year":1828,"dur":5,"story":"A murmuring moto-perpetuo in C♯ minor with a warm, chorale-like major trio."},
  {"id":"schubert-mm-5","c":"schubert","coll":"Moments musicaux","title":"Moment musical No. 5","sub":"Op. 94","key":"F minor","level":6,"year":1828,"dur":2,"story":"A stamping, defiant Allegro vivace, terse and driving."},
  {"id":"schubert-mm-6","c":"schubert","coll":"Moments musicaux","title":"Moment musical No. 6","sub":"Op. 94","key":"A♭ major","level":6,"year":1828,"dur":6,"story":"A wistful, harmonically searching Allegretto — gentle on the surface but quietly heartbroken."},
  {"id":"schumann-g16","c":"schumann","coll":"Kinderszenen, Op. 15","title":"Träumerei","sub":"Kinderszenen Op. 15","key":"F major","level":4,"year":1838,"dur":3,"story":"'Dreaming' — the most famous of the Kinderszenen ('Scenes from Childhood'), a tiny, perfect reverie of remembered innocence beloved the world over."},
  {"id":"schumann-kind-1","c":"schumann","coll":"Kinderszenen, Op. 15","title":"Von fremden Ländern und Menschen","sub":"No. 1","key":"G major","level":4,"year":1838,"dur":2,"story":"'Of Foreign Lands and Peoples' — the gently rocking, wide-eyed opening that draws us into a child's world."},
  {"id":"schumann-kind-2","c":"schumann","coll":"Kinderszenen, Op. 15","title":"Kuriose Geschichte","sub":"No. 2","key":"D major","level":4,"year":1838,"dur":1.5,"story":"'A Curious Story' — a chattering, inquisitive little tale."},
  {"id":"schumann-kind-3","c":"schumann","coll":"Kinderszenen, Op. 15","title":"Hasche-Mann","sub":"No. 3","key":"B minor","level":5,"year":1838,"dur":1,"story":"'Blind Man's Bluff' — a breathless, darting game of catch."},
  {"id":"schumann-kind-4","c":"schumann","coll":"Kinderszenen, Op. 15","title":"Bittendes Kind","sub":"No. 4","key":"D major","level":4,"year":1838,"dur":1,"story":"'Pleading Child' — a tender, questioning appeal that ends unresolved, still asking."},
  {"id":"schumann-kind-5","c":"schumann","coll":"Kinderszenen, Op. 15","title":"Glückes genug","sub":"No. 5","key":"D major","level":4,"year":1838,"dur":1.5,"story":"'Happy Enough' — bubbling contentment in skipping dotted rhythms."},
  {"id":"schumann-kind-6","c":"schumann","coll":"Kinderszenen, Op. 15","title":"Wichtige Begebenheit","sub":"No. 6","key":"A major","level":4,"year":1838,"dur":1,"story":"'An Important Event' — a child's grand, self-important little march."},
  {"id":"schumann-kind-8","c":"schumann","coll":"Kinderszenen, Op. 15","title":"Am Kamin","sub":"No. 8","key":"F major","level":4,"year":1838,"dur":1.5,"story":"'At the Fireside' — warm, cozy domestic contentment."},
  {"id":"schumann-kind-9","c":"schumann","coll":"Kinderszenen, Op. 15","title":"Ritter vom Steckenpferd","sub":"No. 9","key":"C major","level":4,"year":1838,"dur":1,"story":"'Knight of the Hobby-Horse' — a bouncing, galloping ride on an imaginary steed."},
  {"id":"schumann-kind-10","c":"schumann","coll":"Kinderszenen, Op. 15","title":"Fast zu ernst","sub":"No. 10","key":"G♯ minor","level":5,"year":1838,"dur":2.5,"story":"'Almost Too Serious' — a searching, syncopated meditation, gravely beautiful."},
  {"id":"schumann-kind-11","c":"schumann","coll":"Kinderszenen, Op. 15","title":"Fürchtenmachen","sub":"No. 11","key":"E minor","level":4,"year":1838,"dur":2,"story":"'Frightening' — playful mock-terror, alternating hushed suspense and sudden scares."},
  {"id":"schumann-kind-12","c":"schumann","coll":"Kinderszenen, Op. 15","title":"Kind im Einschlummern","sub":"No. 12","key":"E minor","level":4,"year":1838,"dur":2,"story":"'Child Falling Asleep' — a drowsy lullaby sinking into an unresolved, sleeping close."},
  {"id":"schumann-kind-13","c":"schumann","coll":"Kinderszenen, Op. 15","title":"Der Dichter spricht","sub":"No. 13","key":"G major","level":5,"year":1838,"dur":2.5,"story":"'The Poet Speaks' — the grown-up poet's tender epilogue, with a hushed, improvisatory recitative."},
  {"id":"schumann-g17","c":"schumann","title":"Arabeske","sub":"Op. 18","key":"C major","level":6,"year":1839,"dur":7,"story":"A graceful rondo whose sunny refrain keeps returning between wistful minor episodes, closing with one of Schumann's most touching, whispered codas."},
    {"id":"schumann-fant-1","c":"schumann","coll":"Fantasie in C, Op. 17","title":"Durchaus fantastisch und leidenschaftlich vorzutragen","sub":"I","key":"C major","level":10,"year":1836,"dur":13,"story":"A surging, impassioned outpouring that hides a Beethoven song-quotation and Schumann's coded longing for Clara."},
  {"id":"schumann-fant-2","c":"schumann","coll":"Fantasie in C, Op. 17","title":"Mässig. Durchaus energisch","sub":"II","key":"E♭ major","level":10,"year":1836,"dur":8,"story":"A grand, dotted-rhythm march building to a famously treacherous leaping coda."},
  {"id":"schumann-fant-3","c":"schumann","coll":"Fantasie in C, Op. 17","title":"Langsam getragen. Durchweg leise zu halten","sub":"III","key":"C major","level":9,"year":1836,"dur":11,"story":"A hushed, radiant slow finale of serene, dissolving beauty."},
  {"id":"schumann-g20","c":"schumann","title":"Toccata","sub":"Op. 7","key":"C major","level":11,"year":1832,"dur":6,"story":"One of the most punishing showpieces of the early Romantic era — a relentless perpetual motion in double notes that Schumann himself called the hardest piece ever written."},
  {"id":"pap-1","c":"schumann","coll":"Papillons, Op. 2","title":"Introduzione — Waltz","sub":"No. 1","key":"D major","level":6,"year":1831,"dur":1.5,"story":"A brief solemn call flings open the masked ball, then whirls into the first waltz."},
  {"id":"pap-2","c":"schumann","coll":"Papillons, Op. 2","title":"Waltz: Prestissimo","sub":"No. 2","key":"E♭ major","level":6,"year":1831,"dur":0.5,"story":"A tiny, breathless whirl of a dance."},
