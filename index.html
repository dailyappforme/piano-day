  {"id":"mend-op102-2","c":"mendelssohn","coll":"Songs Without Words","title":"Retrospection","sub":"Op. 102 No. 2","key":"D major","level":6,"year":1845,"dur":2,"story":"A gentle, backward-looking Adagio."},
  {"id":"mend-op102-3","c":"mendelssohn","coll":"Songs Without Words","title":"Tarantella","sub":"Op. 102 No. 3","key":"C major","level":7,"year":1845,"dur":1.5,"story":"A whirling, breathless Presto tarantella."},
  {"id":"mend-op102-4","c":"mendelssohn","coll":"Songs Without Words","title":"The Sighing Wind","sub":"Op. 102 No. 4","key":"G minor","level":6,"year":1845,"dur":2,"story":"A murmuring, uneasy song like wind through the trees."},
  {"id":"mend-op102-5","c":"mendelssohn","coll":"Songs Without Words","title":"The Joyous Peasant","sub":"Op. 102 No. 5","key":"A major","level":6,"year":1845,"dur":1.5,"story":"A jaunty, foot-stamping Allegro vivace of rustic cheer."},
  {"id":"mend-op102-6","c":"mendelssohn","coll":"Songs Without Words","title":"Faith","sub":"Op. 102 No. 6","key":"C major","level":6,"year":1845,"dur":2.5,"story":"A serene, hymn-like Andante closing the entire cycle."},
  {"id":"grieg-g34","c":"grieg","coll":"Lyric Pieces","title":"Wedding Day at Troldhaugen","sub":"Lyric Pieces Op. 65 No. 6","key":"D major","level":7,"year":1897,"dur":6,"story":"A jubilant processional celebrating Grieg's own silver wedding at his villa Troldhaugen — you can almost hear the guests arriving, the bells, and the dancing."},
  {"id":"grieg-g35","c":"grieg","coll":"Lyric Pieces","title":"To Spring","sub":"Op. 43 No. 6","key":"A♭ major","level":6,"year":1886,"dur":3,"story":"'To Spring' — one of the best-loved Lyric Pieces, a warm swelling melody that captures the sudden, rushing arrival of the northern spring."},
  {"id":"grieg-g36","c":"grieg","coll":"Lyric Pieces","title":"Butterfly","sub":"Op. 43 No. 1","key":"A major","level":6,"year":1886,"dur":2,"story":"'Butterfly' — delicate, fluttering wings dart and hover through the air in a shimmer of light chromatic figures."},
  {"id":"grieg-g37","c":"grieg","coll":"Lyric Pieces","title":"Notturno","sub":"Op. 54 No. 4","key":"C major","level":6,"year":1891,"dur":4,"story":"A dreamy night-piece from the Lyric Pieces, its still, moonlit calm brushed by little trills of nocturnal birdsong."},
  {"id":"grieg-g38","c":"grieg","coll":"Lyric Pieces","title":"March of the Trolls","sub":"Op. 54 No. 3","key":"D minor","level":7,"year":1891,"dur":3,"story":"Trolls scurry through a wild, hushed minor march that erupts and vanishes, framing a serene, luminous vision of the Norwegian night."},
  {"id":"grieg-g39","c":"grieg","coll":"Lyric Pieces","title":"Arietta","sub":"Op. 12 No. 1","key":"E♭ major","level":3,"year":1867,"dur":1.5,"story":"The very first Lyric Piece — a simple, tender little song. Grieg loved it so much he quoted it again in 'Remembrances,' the last piece of the very last book, closing the circle of his life's work."},
  {"id":"grieg-g40","c":"grieg","title":"Holberg Suite","sub":"Op. 40","key":"G major","level":7,"year":1884,"dur":18,"story":"A neo-Baroque suite 'in olden style' honoring the playwright Ludvig Holberg — the sparkling piano original of the work now famous in its string-orchestra version."},
  {"id":"grieg-cradle","c":"grieg","title":"Cradle Song","sub":"Op. 68 No. 5","key":"E major","level":4,"year":1899,"dur":3,"story":"'At the Cradle' (Bådnlåt), from the ninth book of Lyric Pieces — a tender, rocking lullaby whose gentle sway floats over a lulling left-hand ostinato."},
  {"id":"grieg-op12-2","c":"grieg","coll":"Lyric Pieces","title":"Waltz","sub":"Op. 12 No. 2","key":"A minor","level":4,"year":1867,"dur":1.5,"story":"A wistful little waltz from the first book of Lyric Pieces — its lilting minor-key turns lean now sweet, now melancholy, like a dance remembered rather than danced."},
  {"id":"grieg-op12-3","c":"grieg","coll":"Lyric Pieces","title":"Watchman's Song","sub":"Op. 12 No. 3","key":"E major","level":4,"year":1867,"dur":2.5,"story":"Grieg wrote this after seeing a performance of Shakespeare's Macbeth — a night-watchman's calm hymn framing a hushed, uneasy 'Spirits of the night' interlude."},
  {"id":"grieg-op12-4","c":"grieg","coll":"Lyric Pieces","title":"Fairy Dance","sub":"Op. 12 No. 4","key":"E minor","level":5,"year":1867,"dur":1,"story":"'Elfentanz' — elves flicker and scamper through a whirl of light, staccato leaps, gone almost before you catch them."},
  {"id":"grieg-op12-5","c":"grieg","coll":"Lyric Pieces","title":"Folk Song","sub":"Op. 12 No. 5","key":"E minor","level":3,"year":1867,"dur":1.5,"story":"'Folkevise' — a simple, heartfelt Norwegian folk melody, sung plainly and without ornament, close to the roots Grieg treasured all his life."},
  {"id":"grieg-op12-6","c":"grieg","coll":"Lyric Pieces","title":"Norwegian Melody","sub":"Op. 12 No. 6","key":"D major","level":4,"year":1867,"dur":1,"story":"'Norsk' — a brisk, foot-stamping dance in the springar spirit, its droning open fifths evoking the Hardanger fiddle."},
  {"id":"grieg-op12-7","c":"grieg","coll":"Lyric Pieces","title":"Album Leaf","sub":"Op. 12 No. 7","key":"E major","level":3,"year":1867,"dur":2,"story":"'Albumblatt' — a gentle, songful page written as if jotted into a friend's keepsake album, flowing and unhurried."},
  {"id":"grieg-op12-8","c":"grieg","coll":"Lyric Pieces","title":"National Song","sub":"Op. 12 No. 8","key":"B♭ major","level":3,"year":1867,"dur":1.5,"story":"'Fædrelandssang' — a broad, maestoso patriotic hymn that closes the first book of Lyric Pieces with quiet, upright dignity."},
  {"id":"grieg-op43-2","c":"grieg","coll":"Lyric Pieces","title":"Solitary Traveller","sub":"Op. 43 No. 2","key":"E minor","level":5,"year":1886,"dur":2.5,"story":"'Ensom vandrer' — a lone wanderer walks a quiet road, the wistful minor melody rising to a brief, warm outpouring before fading back into solitude."},
  {"id":"grieg-op43-3","c":"grieg","coll":"Lyric Pieces","title":"In My Native Country","sub":"Op. 43 No. 3","key":"A major","level":5,"year":1886,"dur":2.5,"story":"'I hjemmet' — a serene, songful homage to home ground, its flowing melody glowing with quiet pride and belonging."},
  {"id":"grieg-op43-4","c":"grieg","coll":"Lyric Pieces","title":"Little Bird","sub":"Op. 43 No. 4","key":"F major","level":5,"year":1886,"dur":1.5,"story":"'Småfugl' — a tiny bird hops and trills through light, quick grace notes and staccato chirps, one of Grieg's most charming miniatures."},
  {"id":"grieg-op43-5","c":"grieg","coll":"Lyric Pieces","title":"Erotik","sub":"Op. 43 No. 5","key":"B major","level":5,"year":1886,"dur":3,"story":"'Erotikk' — a tender, swelling love-song whose long-breathed melody blooms into an ardent, passionate climax before settling into calm."},
  {"id":"grieg-op54-1","c":"grieg","coll":"Lyric Pieces","title":"Shepherd's Boy","sub":"Op. 54 No. 1","key":"A minor","level":6,"year":1891,"dur":3.5,"story":"'Gjætergut' — a young herdsboy daydreams alone on the mountainside, his brooding minor reverie swelling to a passionate outcry before the loneliness returns."},
  {"id":"grieg-op54-2","c":"grieg","coll":"Lyric Pieces","title":"Norwegian March","sub":"Op. 54 No. 2","key":"D major","level":5,"year":1891,"dur":4,"story":"'Gangar' — a striding Norwegian peasant march, its stamping rhythm and drone fifths conjuring a village procession winding past."},
  {"id":"grieg-op54-5","c":"grieg","coll":"Lyric Pieces","title":"Scherzo","sub":"Op. 54 No. 5","key":"E minor","level":6,"year":1891,"dur":3,"story":"A quicksilver, prestissimo scherzo that darts and glitters, pausing for a graceful waltz-like trio before whirling off again."},
  {"id":"grieg-op54-6","c":"grieg","coll":"Lyric Pieces","title":"Bell Ringing","sub":"Op. 54 No. 6","key":"C♯ minor","level":5,"year":1891,"dur":3.5,"story":"'Klokkeklang' — Grieg conjures pealing church bells almost entirely from bare open fifths, a strikingly modern, atmospheric soundscape that anticipates Debussy."},
  {"id":"grieg-op65-4","c":"grieg","coll":"Lyric Pieces","title":"Salon","sub":"Op. 65 No. 4","key":"A major","level":5,"year":1896,"dur":3,"story":"An elegant, waltzing drawing-room piece — light and gracious, with a knowing, slightly ironic charm."},
  {"id":"grieg-op65-5","c":"grieg","coll":"Lyric Pieces","title":"In Ballad Style","sub":"Op. 65 No. 5","key":"G minor","level":6,"year":1896,"dur":4.5,"story":"'Im Balladenton' — a dark, story-telling piece in the manner of an old Norwegian ballad, its solemn theme growing ever more impassioned."},
  {"id":"grieg-op68-1","c":"grieg","coll":"Lyric Pieces","title":"Sailor's Song","sub":"Op. 68 No. 1","key":"A minor","level":5,"year":1898,"dur":2,"story":"'Matrosernes opsang' — a vigorous, salt-sprayed sea-shanty, sailors hauling in rhythm as the ship rolls beneath them."},
  {"id":"grieg-op68-2","c":"grieg","coll":"Lyric Pieces","title":"Grandmother's Minuet","sub":"Op. 68 No. 2","key":"G major","level":4,"year":1898,"dur":2.5,"story":"'Bestemors menuett' — a fond, gently teasing portrait of grandmother dancing an old-fashioned minuet, prim and a little unsteady."},
  {"id":"grieg-op68-3","c":"grieg","coll":"Lyric Pieces","title":"At Your Feet","sub":"Op. 68 No. 3","key":"B minor","level":5,"year":1898,"dur":3.5,"story":"'For dine fødder' — a warm, devoted love-song that pours out its heart with rising, ardent tenderness."},
  {"id":"grieg-op68-4","c":"grieg","coll":"Lyric Pieces","title":"Evening in the Mountains","sub":"Op. 68 No. 4","key":"A minor","level":5,"year":1898,"dur":3.5,"story":"'Aften på højfjeldet' — a lone shepherd's-pipe melody floats over vast, still mountain air before soft chords answer like distant cowbells at dusk."},
  {"id":"grieg-op68-6","c":"grieg","coll":"Lyric Pieces","title":"Melancholy","sub":"Op. 68 No. 6","key":"A minor","level":5,"year":1898,"dur":4,"story":"'Melankoli' — a slow, brooding valse mélancolique, its wistful sway shadowed by longing and quiet resignation."},
  {"id":"tchaikovsky-g41","c":"tchaikovsky","coll":"The Seasons","title":"June: Barcarolle","sub":"The Seasons Op. 37b","key":"G minor","level":5,"year":1876,"dur":5,"story":"'June: Barcarolle' — the most beloved of The Seasons, a wistful, gently rocking song that captures the melancholy of a Russian summer evening on the water."},
  {"id":"tchaikovsky-g42","c":"tchaikovsky","coll":"The Seasons","title":"November: Troika","sub":"Op. 37b","key":"E major","level":6,"year":1876,"dur":3,"story":"'November: Troika' — a horse-drawn sleigh dashes across the snow, its harness bells jingling brightly through the frosty air."},
  {"id":"tchaikovsky-g43","c":"tchaikovsky","coll":"The Seasons","title":"October: Autumn Song","sub":"Op. 37b","key":"D minor","level":5,"year":1876,"dur":4,"story":"'October: Autumn Song' — a tender, fading melody breathes the quiet melancholy of the Russian autumn, leaves drifting down one by one."},
  {"id":"tchaikovsky-g44","c":"tchaikovsky","title":"Nocturne in C♯ minor","sub":"Op. 19 No. 4","key":"C♯ minor","level":5,"year":1873,"dur":4,"story":"A tender, singing nocturne with a cello-like melody — Tchaikovsky loved it enough to arrange it for cello and orchestra."},
  {"id":"tchaikovsky-g45","c":"tchaikovsky","title":"Dumka","sub":"Op. 59","key":"C minor","level":8,"year":1886,"dur":9,"story":"'Dumka: A Russian Rustic Scene' — after the Slavic dumka form, it swings between brooding, heavy-hearted melancholy and bursts of wild peasant revelry."},
  {"id":"tch-jan","c":"tchaikovsky","coll":"The Seasons","title":"January: By the Hearth","sub":"Op. 37b No. 1","key":"A major","level":6,"year":1876,"dur":4.5,"story":"'By the Hearth' — a cozy, dreamy winter reverie beside the fire."},
  {"id":"tch-feb","c":"tchaikovsky","coll":"The Seasons","title":"February: Carnival","sub":"Op. 37b No. 2","key":"D major","level":6,"year":1876,"dur":3,"story":"'Carnival' — a boisterous, whirling Shrovetide festival."},
  {"id":"tch-mar","c":"tchaikovsky","coll":"The Seasons","title":"March: Song of the Lark","sub":"Op. 37b No. 3","key":"G minor","level":5,"year":1876,"dur":2.5,"story":"'Song of the Lark' — a delicate spring birdsong trilling over quiet fields."},
  {"id":"tch-apr","c":"tchaikovsky","coll":"The Seasons","title":"April: Snowdrop","sub":"Op. 37b No. 4","key":"B♭ major","level":6,"year":1876,"dur":2.5,"story":"'Snowdrop' — the year's first flower, fresh and tremulous with hope."},
  {"id":"tch-may","c":"tchaikovsky","coll":"The Seasons","title":"May: Starlit Nights","sub":"Op. 37b No. 5","key":"G major","level":6,"year":1876,"dur":4,"story":"'Starlit Nights' (White Nights) — a tender St. Petersburg night that blooms into rapture."},
  {"id":"tch-jul","c":"tchaikovsky","coll":"The Seasons","title":"July: Song of the Reaper","sub":"Op. 37b No. 7","key":"E♭ major","level":6,"year":1876,"dur":2,"story":"'Song of the Reaper' — a robust peasant harvest song."},
  {"id":"tch-aug","c":"tchaikovsky","coll":"The Seasons","title":"August: Harvest","sub":"Op. 37b No. 8","key":"B minor","level":7,"year":1876,"dur":4,"story":"'Harvest' — a bustling scene of gathering the crops, with a lyrical central rest."},
  {"id":"tch-sep","c":"tchaikovsky","coll":"The Seasons","title":"September: The Hunt","sub":"Op. 37b No. 9","key":"G major","level":6,"year":1876,"dur":3,"story":"'The Hunt' — a galloping horn-call hunt in full cry."},
  {"id":"tch-dec","c":"tchaikovsky","coll":"The Seasons","title":"December: Christmas","sub":"Op. 37b No. 12","key":"A♭ major","level":6,"year":1876,"dur":4,"story":"'Christmas' — a gentle waltz for the Yuletide season, closing the year in warmth."},
  {"id":"debussy-g74","c":"debussy","coll":"Suite bergamasque","title":"Prélude","sub":"Suite bergamasque","key":"F major","level":6,"year":1905,"dur":4,"story":"The flowing opening of the Suite bergamasque — half-Romantic reverie, half-improvisation, it already hints at the shimmering impressionist world Debussy was about to invent."},
  {"id":"debussy-g75","c":"debussy","coll":"Suite bergamasque","title":"Menuet","sub":"Suite bergamasque","key":"A minor","level":5,"year":1905,"dur":4,"story":"A wry, archaic minuet from the Suite bergamasque — courtly grace slyly tilted by modern harmonies, as if an old dance were remembered through a dream."},
  {"id":"debussy-g76","c":"debussy","coll":"Suite bergamasque","title":"Passepied","sub":"Suite bergamasque","key":"F♯ minor","level":6,"year":1905,"dur":3,"story":"The sparkling finale of the Suite bergamasque — a featherlight moto perpetuo skips over a staccato bass, more mischievous scherzo than stately old dance."},
  {"id":"debussy-g77","c":"debussy","coll":"Arabesques, L. 66","title":"No. 2","key":"G major","level":6,"year":1891,"dur":3,"story":"The livelier, quicksilver twin of the famous first Arabesque — playful curling lines that dart and tumble with youthful charm.\n\nThe two Arabesques were the first piano music Debussy ever got into print. He signed the contract in April 1891 and was paid 200 francs for the pair, which appeared that November in a run of just 300 copies. Fame came slowly — only about 1,200 copies of each sold over the next twelve years — before they grew into some of his most beloved and most-played works."},
  {"id":"debussy-g78","c":"debussy","coll":"Estampes","title":"Pagodes","sub":"Estampes","key":"B major","level":8,"year":1903,"dur":5,"story":"'Pagodas' — Debussy builds this from the shimmering pentatonic (five-note) scales and layered gong-and-chime textures of the Javanese gamelan, the Indonesian percussion orchestra that mesmerised him at the 1889 Paris Exposition Universelle (the world's fair that also debuted the Eiffel Tower). He said he'd never heard anything so free, and the gamelan's ringing, non-Western sonorities helped loosen his music from traditional harmony. Together with his love of Japanese ukiyo-e prints — Hokusai's 'Great Wave' would later grace the cover of La Mer — this fascination with East Asia runs right through his sound world."},
  {"id":"debussy-g79","c":"debussy","coll":"Estampes","title":"La soirée dans Grenade","sub":"Estampes","key":"A minor","level":8,"year":1903,"dur":5,"story":"'Evening in Granada' — a sultry habanera conjuring a Spain Debussy had never visited. Manuel de Falla marveled that it captured Andalusia more truly than many Spanish works."},
  {"id":"debussy-g80","c":"debussy","coll":"Estampes","title":"Jardins sous la pluie","sub":"Estampes","key":"E major","level":9,"year":1903,"dur":4,"story":"'Gardens in the Rain' — a downpour drums across the keyboard, woven from two French nursery tunes, before the sun breaks through in a final glittering rainbow."},
  {"id":"debussy-g81","c":"debussy","coll":"Children's Corner","title":"Golliwogg's Cakewalk","sub":"Children's Corner","key":"E♭ major","level":6,"year":1908,"dur":3,"story":"A cheeky ragtime cakewalk written for his little daughter Chouchou — and midway it slyly quotes the great love-chord from Wagner's Tristan, with a wink."},
  {"id":"debussy-g82","c":"debussy","coll":"Children's Corner","title":"The Snow Is Dancing","sub":"Children's Corner","key":"various","level":7,"year":1908,"dur":2.5,"story":"From Children's Corner — dry, delicate staccato flakes drift and settle, a child watching the first snow fall past the window."},
  {"id":"debussy-g83","c":"debussy","coll":"Préludes, Book 1","title":"La cathédrale engloutie","sub":"Préludes, Book 1","key":"C major","level":7,"year":1910,"dur":6,"story":"'The Sunken Cathedral' — the legendary drowned cathedral of Ys rises from the sea at dawn, its bells and organ chords tolling through the mist before it sinks again."},
  {"id":"deb-pre1-1","c":"debussy","coll":"Préludes, Book 1","title":"Danseuses de Delphes","sub":"Préludes, Book 1","key":"B♭ major","level":6,"year":1910,"dur":3,"story":"'Dancers of Delphi' — the set opens with a slow, stately sarabande, inspired by an ancient Greek relief of three bacchantes Debussy saw at the Louvre. Grave and veiled, it moves in soft parallel chords."},
  {"id":"deb-pre1-3","c":"debussy","coll":"Préludes, Book 1","title":"Le vent dans la plaine","sub":"Préludes, Book 1","key":"B♭ minor","level":8,"year":1910,"dur":2.5,"story":"'The wind on the plain' — a shivering, ceaseless murmur in the low register over which little gusts flicker. Marked 'aussi légèrement que possible' — as lightly as possible."},
  {"id":"deb-pre1-4","c":"debussy","coll":"Préludes, Book 1","title":"Les sons et les parfums tournent dans l'air du soir","sub":"Préludes, Book 1","key":"A major","level":8,"year":1910,"dur":3.5,"story":"'Sounds and perfumes swirl in the evening air' — a line borrowed from Baudelaire. Languid and sensuous, waltz fragments and distant fanfares drift through a haze of shifting harmony."},
  {"id":"deb-pre1-5","c":"debussy","coll":"Préludes, Book 1","title":"Les collines d'Anacapri","sub":"Préludes, Book 1","key":"B major","level":8,"year":1910,"dur":3,"story":"'The hills of Anacapri' — sun-drenched Italy: a tarantella dances, church bells peal, and a Neapolitan song floats up from below. Bright, brilliant and full of southern light."},
  {"id":"deb-pre1-7","c":"debussy","coll":"Préludes, Book 1","title":"Ce qu'a vu le vent d'ouest","sub":"Préludes, Book 1","key":"F♯ minor","level":11,"year":1910,"dur":3.5,"story":"'What the west wind saw' — a ferocious storm-piece, the most virtuosic of Book I. Howling chromatic gusts and thundering climaxes evoke a raging sea, perhaps recalling Andersen's tale."},
  {"id":"deb-pre1-9","c":"debussy","coll":"Préludes, Book 1","title":"La sérénade interrompue","sub":"Préludes, Book 1","key":"A minor","level":8,"year":1910,"dur":2.5,"story":"'The interrupted serenade' — a guitar-strumming suitor keeps being cut off by outbursts and stray fragments of other music, a wry Spanish scene full of comic frustration."},
  {"id":"deb-pre1-11","c":"debussy","coll":"Préludes, Book 1","title":"La danse de Puck","sub":"Préludes, Book 1","key":"E♭ major","level":8,"year":1910,"dur":2.5,"story":"'Puck's dance' — the mischievous sprite from A Midsummer Night's Dream flits and vanishes in capricious, light-footed leaps, with distant horn-calls hinting at the enchanted forest."},
  {"id":"deb-etude-1","c":"debussy","coll":"Études, L. 136","title":"Pour les cinq doigts","sub":"Études · No. 1","key":"—","level":9,"year":1915,"dur":3,"story":"'For the five fingers, after Monsieur Czerny' — begins as a prim finger exercise, then gleefully derails into wrong notes and cheeky asides, Debussy poking fun at the dry drills of his youth."},
  {"id":"deb-etude-2","c":"debussy","coll":"Études, L. 136","title":"Pour les tierces","sub":"Études · No. 2","key":"—","level":10,"year":1915,"dur":3.5,"story":"A study in thirds — shimmering parallel thirds ripple across the keyboard, turning a classic technical hurdle into iridescent colour."},
  {"id":"deb-etude-3","c":"debussy","coll":"Études, L. 136","title":"Pour les quartes","sub":"Études · No. 3","key":"—","level":9,"year":1915,"dur":4,"story":"A study in fourths — the open, faintly exotic sound of parallel fourths gives this étude an oriental, whole-tone haze unlike anything before it."},
  {"id":"deb-etude-4","c":"debussy","coll":"Études, L. 136","title":"Pour les sixtes","sub":"Études · No. 4","key":"—","level":8,"year":1915,"dur":3.5,"story":"A study in sixths — languid and tender, marked Lento, the parallel sixths spun into a slow, sensuous song."},
  {"id":"deb-etude-5","c":"debussy","coll":"Études, L. 136","title":"Pour les octaves","sub":"Études · No. 5","key":"—","level":10,"year":1915,"dur":3,"story":"A study in octaves — 'joyous and impetuous,' a whirling waltz-like romp that tosses octaves gleefully around the keyboard."},
  {"id":"deb-etude-6","c":"debussy","coll":"Études, L. 136","title":"Pour les huit doigts","sub":"Études · No. 6","key":"—","level":10,"year":1915,"dur":2,"story":"'For the eight fingers' — Debussy noted the thumbs are best left out, so rapid scales flutter by on the other eight, light and mercurial."},
  {"id":"deb-etude-7","c":"debussy","coll":"Études, L. 136","title":"Pour les degrés chromatiques","sub":"Études · No. 7","key":"—","level":9,"year":1915,"dur":2,"story":"A study in chromatic steps — a low chromatic murmur buzzes and scurries while fragments of melody dart above it."},
  {"id":"deb-etude-8","c":"debussy","coll":"Études, L. 136","title":"Pour les agréments","sub":"Études · No. 8","key":"—","level":9,"year":1915,"dur":4.5,"story":"A study in ornaments — grace notes, turns and flourishes drape a freely improvisatory, barcarolle-like reverie."},
  {"id":"deb-etude-9","c":"debussy","coll":"Études, L. 136","title":"Pour les notes répétées","sub":"Études · No. 9","key":"—","level":9,"year":1915,"dur":3.5,"story":"A study in repeated notes — light, scherzando chatter, dry and witty, the same note tapped over and over with feather-fingered control."},
  {"id":"deb-etude-10","c":"debussy","coll":"Études, L. 136","title":"Pour les sonorités opposées","sub":"Études · No. 10","key":"—","level":9,"year":1915,"dur":4,"story":"A study in opposed sonorities — distant bell-like layers ring at different dynamics and registers at once, a study in balancing planes of sound."},
  {"id":"deb-etude-11","c":"debussy","coll":"Études, L. 136","title":"Pour les arpèges composés","sub":"Études · No. 11","key":"—","level":10,"year":1915,"dur":4,"story":"A study in rolled arpeggios — the most beloved of the set, cascades of composite arpeggios flow like light on water, with a jazzy, improvisatory middle."},
  {"id":"deb-etude-12","c":"debussy","coll":"Études, L. 136","title":"Pour les accords","sub":"Études · No. 12","key":"—","level":11,"year":1915,"dur":4,"story":"A study in chords — ferocious, hammering blocks of sound frame a hushed, mysterious centre; a percussive tour de force to close the set."},
  {"id":"debussy-g84","c":"debussy","coll":"Préludes, Book 1","title":"Minstrels","sub":"Préludes, Book 1","key":"G major","level":6,"year":1910,"dur":2,"story":"A music-hall sketch — banjo strums, comic stumbles and cheeky syncopations conjure a troupe of end-of-the-pier entertainers."},
  {"id":"debussy-g85","c":"debussy","coll":"Préludes, Book 1","title":"Des pas sur la neige","sub":"Préludes, Book 1","key":"D minor","level":6,"year":1910,"dur":4,"story":"'Footprints in the Snow' — over a bleak, repeating two-note step, a desolate melody wanders through a frozen, silent landscape. One of Debussy's most haunting pages."},
  {"id":"debussy-g86","c":"debussy","coll":"Préludes, Book 1","title":"Voiles","sub":"Préludes, Book 1","key":"various","level":6,"year":1910,"dur":4,"story":"'Sails' (or 'Veils') — almost entirely built on the weightless whole-tone scale, the music drifts without an anchor, a pentatonic breeze stirring it briefly at the center."},
  {"id":"debussy-g87","c":"debussy","coll":"Pour le piano","title":"Toccata","sub":"Pour le piano","key":"C♯ minor","level":9,"year":1901,"dur":4,"story":"The brilliant, motoric finale of Pour le piano — a glittering neo-Baroque toccata that races without pause to a dazzling close."},
  {"id":"debussy-g88","c":"debussy","coll":"Pour le piano","title":"Sarabande","sub":"Pour le piano","key":"C♯ minor","level":6,"year":1901,"dur":5,"story":"A grave, noble sarabande from Pour le piano — slow, modal chords move with an antique dignity that looks back to the old French clavecinists."},
  {"id":"debussy-g89","c":"debussy","title":"L'isle joyeuse","sub":"L. 106","key":"A major","level":9,"year":1904,"dur":6,"story":"'The Joyous Isle' — dazzling and ecstatic, inspired by Watteau's painting of lovers embarking for the isle of Cythera, and written during Debussy's own elopement. A blaze of sensuous joy."},
  {"id":"debussy-g90","c":"debussy","title":"La plus que lente","sub":"L. 121","key":"G♭ major","level":5,"year":1910,"dur":4,"story":"'The more-than-slow waltz' — a languid, faintly ironic salon waltz, all perfume and shrug, tipping its hat to the café dance-bands of the day."},
  {"id":"liszt-g91","c":"liszt","coll":"Liebesträume","title":"Liebestraum No. 1","sub":"S. 541","key":"A♭ major","level":7,"year":1850,"dur":5,"story":"From Liszt's three Liebesträume ('Dreams of Love') — a rapturous nocturne in which a soaring melody rises through cascading arpeggios, the piano singing a wordless song set to a poem urging us to love as long as we can."},
  {"id":"liszt-g92","c":"liszt","coll":"Hungarian Rhapsodies","title":"Hungarian Rhapsody No. 2","sub":"S. 244","key":"C♯ minor","level":9,"year":1847,"dur":10,"story":"The most famous of the Hungarian Rhapsodies — a brooding, gypsy-style lassan gives way to a wild, accelerating friska. Its tunes are so iconic they've soundtracked cartoons for a century."},
  {"id":"liszt-g93","c":"liszt","coll":"Hungarian Rhapsodies","title":"Hungarian Rhapsody No. 6","sub":"S. 244","key":"D♭ major","level":9,"year":1847,"dur":7,"story":"A Hungarian Rhapsody that builds to a legendary whirlwind of hammered repeated octaves — a barnstorming virtuoso warhorse."},
  {"id":"liszt-g94","c":"liszt","coll":"Consolations","title":"Consolation No. 1","sub":"S. 172","key":"E major","level":5,"year":1850,"dur":3,"story":"The gentlest of Liszt's six Consolations — a quiet, hymn-like reverie, tender and consoling exactly as its title promises."},
  {"id":"liszt-g95","c":"liszt","coll":"Transcendental Études","title":"Transcendental Étude No. 4 'Mazeppa'","sub":"S. 139","key":"D minor","level":11,"year":1852,"dur":8,"story":"'Mazeppa' — after the legend of the man bound naked to a wild horse and set loose across the steppe. Thundering double-note octaves gallop to collapse, then rise in triumph."},
  {"id":"liszt-g96","c":"liszt","coll":"Concert Études","title":"Un sospiro","sub":"Concert Étude No. 3","key":"D♭ major","level":9,"year":1848,"dur":6,"story":"'A Sigh' — a singing melody is passed hand-over-hand while sweeping arpeggios cross above and below it, one of the most poetic study-pieces ever written."},
  {"id":"liszt-g97","c":"liszt","title":"Piano Sonata in B minor","sub":"S. 178","key":"B minor","level":11,"year":1853,"dur":30,"story":"Liszt's monumental Sonata — a single vast movement built almost entirely from a handful of themes ceaselessly transformed. Baffling to its first audiences, it is now revered as a summit of Romantic piano music."},
  {"id":"liszt-g98","c":"liszt","coll":"Années de pèlerinage","title":"Les jeux d'eaux à la Villa d'Este","sub":"Années de pèlerinage 3","key":"F♯ major","level":8,"year":1877,"dur":8,"story":"'The Fountains of the Villa d'Este' — glittering, spraying water-music that anticipated Ravel and Debussy by decades, crowned by a whispered verse from the Gospel about living water."},
  {"id":"liszt-g99","c":"liszt","coll":"Années de pèlerinage","title":"Sonetto 104 del Petrarca","sub":"Années de pèlerinage 2","key":"E major","level":8,"year":1846,"dur":7,"story":"A wordless piano song after Petrarch's sonnet of love's sweet torment — 'I find no peace, and all my war is done' — its melody aching with Italianate longing."},
  {"id":"liszt-sonetto123","c":"liszt","coll":"Années de pèlerinage","title":"Sonetto 123 del Petrarca","sub":"Années de pèlerinage 2","key":"A♭ major","level":8,"year":1858,"dur":6.5,"story":"The gentlest of the three Petrarch sonnets — 'Lento placido,' a hushed vision of the beloved as an angel on earth, floating in serene, radiant calm."},
  {"id":"liszt-consol5","c":"liszt","coll":"Consolations","title":"Consolation No. 5","sub":"","key":"E major","level":6,"year":1850,"dur":2.5,"story":"A tender, songful consolation, 'Andantino con grazia' — warm and gracefully ornamented, the sunlit companion to the famous No. 3."},
  {"id":"liszt-liebe2","c":"liszt","coll":"Liebesträume","title":"Liebestraum No. 2 (Seliger Tod)","sub":"S. 541","key":"E♭ major","level":8,"year":1850,"dur":4,"story":"'Blissful Death' — a passionate love-dream setting an Uhland poem, sweeping between ecstasy and repose. The lyrical sibling of the ever-famous No. 3."},
  {"id":"liszt-paganini6","c":"liszt","coll":"Grandes études de Paganini","title":"Grande étude de Paganini No. 6 (Theme & Variations)","sub":"S. 141","key":"A minor","level":11,"year":1851,"dur":5,"story":"Liszt's dazzling take on Paganini's famous A-minor caprice theme — eleven variations of escalating fireworks, from delicate filigree to thundering octaves."},
  {"id":"liszt-sposalizio","c":"liszt","coll":"Années de pèlerinage","title":"Sposalizio","sub":"Années 2","key":"E major","level":8,"year":1858,"dur":7,"story":"Inspired by Raphael's painting 'The Marriage of the Virgin' — radiant bells and a serene, unfolding hymn of pure Italian light."},
  {"id":"liszt-penseroso","c":"liszt","coll":"Années de pèlerinage","title":"Il Penseroso","sub":"Années 2","key":"C♯ minor","level":6,"year":1858,"dur":4,"story":"'The Thinker' — after Michelangelo's brooding statue, a dark, solemn meditation in slow, weighted chords."},
  {"id":"liszt-canzonetta","c":"liszt","coll":"Années de pèlerinage","title":"Canzonetta del Salvator Rosa","sub":"Années 2","key":"A major","level":5,"year":1858,"dur":3,"story":"A jaunty little canzonetta on a tune once attributed to the painter Salvator Rosa — proud and marching, the lightest page of the set."},
  {"id":"liszt-sonetto47","c":"liszt","coll":"Années de pèlerinage","title":"Sonetto 47 del Petrarca","sub":"Années 2","key":"D♭ major","level":8,"year":1858,"dur":6,"story":"A wordless love-song after Petrarch — the most exuberant of the three sonnets, blessing the day and hour of first love in soaring melody."},
  {"id":"liszt-dante","c":"liszt","coll":"Années de pèlerinage","title":"Après une lecture du Dante (Dante Sonata)","sub":"Années 2","key":"D minor","level":11,"year":1858,"dur":17,"story":"'After a reading of Dante: Fantasia quasi Sonata' — a vast, hellish single-movement journey from the tritone gates of the Inferno to visions of paradise. One of Liszt's supreme works."},
  {"id":"liszt-te1","c":"liszt","coll":"Transcendental Études, S. 139","title":"Preludio","sub":"No. 1","key":"C major","level":6,"year":1852,"dur":1,"story":"A brief, sweeping fanfare that flings the hands across the keyboard — a curtain-raiser to the whole set."},
  {"id":"liszt-te2","c":"liszt","coll":"Transcendental Études, S. 139","title":"Étude No. 2 in A minor","sub":"No. 2","key":"A minor","level":10,"year":1852,"dur":2.5,"story":"A furious 'Molto vivace' whirlwind of leaps and cross-rhythms, dark and relentless."},
  {"id":"liszt-te3","c":"liszt","coll":"Transcendental Études, S. 139","title":"Paysage","sub":"No. 3","key":"F major","level":7,"year":1852,"dur":5.5,"story":"'Landscape' — a serene pastoral idyll, gentle and songful, a calm oasis among the fireworks."},
  {"id":"liszt-te5","c":"liszt","coll":"Transcendental Études, S. 139","title":"Feux follets","sub":"No. 5","key":"B♭ major","level":11,"year":1852,"dur":3.5,"story":"'Will-o'-the-wisps' — flickering double-note filigree of legendary difficulty, darting like marsh-lights in the dark."},
  {"id":"liszt-te6","c":"liszt","coll":"Transcendental Études, S. 139","title":"Vision","sub":"No. 6","key":"G minor","level":9,"year":1852,"dur":6,"story":"A grand, funereal 'Vision' of tolling bells and sweeping arpeggios, said to evoke Napoleon's funeral cortège."},
  {"id":"liszt-te7","c":"liszt","coll":"Transcendental Études, S. 139","title":"Eroica","sub":"No. 7","key":"E♭ major","level":9,"year":1852,"dur":5,"story":"A heroic march in dotted rhythms and blazing octaves — proud, martial and triumphant."},
  {"id":"liszt-te8","c":"liszt","coll":"Transcendental Études, S. 139","title":"Wilde Jagd","sub":"No. 8","key":"C minor","level":11,"year":1852,"dur":5.5,"story":"'The Wild Hunt' — a demonic gallop, 'Presto furioso,' storming across the keyboard with a lyrical hunting-horn respite."},
  {"id":"liszt-te9","c":"liszt","coll":"Transcendental Études, S. 139","title":"Ricordanza","sub":"No. 9","key":"A♭ major","level":9,"year":1852,"dur":11,"story":"'Remembrance' — Busoni called it 'a bundle of faded love-letters,' a tender, improvisatory reverie drenched in nostalgia and ornament."},
  {"id":"liszt-te10","c":"liszt","coll":"Transcendental Études, S. 139","title":"Étude No. 10 in F minor","sub":"No. 10","key":"F minor","level":10,"year":1852,"dur":5,"story":"An 'Allegro agitato molto' storm of passion — surging, impetuous and one of the most performed of the set."},
  {"id":"liszt-te11","c":"liszt","coll":"Transcendental Études, S. 139","title":"Harmonies du soir","sub":"No. 11","key":"D♭ major","level":10,"year":1852,"dur":9,"story":"'Evening Harmonies' — a sumptuous nocturne of bells and hymns that swells from twilight calm to a radiant, sonorous climax."},
  {"id":"liszt-te12","c":"liszt","coll":"Transcendental Études, S. 139","title":"Chasse-neige","sub":"No. 12","key":"B♭ minor","level":10,"year":1852,"dur":6,"story":"'Snow-drift' — shimmering tremolando builds a relentless blizzard that slowly buries the landscape. A study in atmosphere and endurance."},
  {"id":"liszt-g100","c":"liszt","title":"Mephisto Waltz No. 1","sub":"S. 514","key":"A major","level":11,"year":1860,"dur":11,"story":"The First Mephisto Waltz — after Lenau's Faust, the devil seizes a fiddle at a village tavern and drives the dancers into a sensual, demonic frenzy."},
  {"id":"satie-g118","c":"satie","coll":"Gymnopédies","title":"Gymnopédie No. 2","sub":"","key":"C major","level":3,"year":1888,"dur":3,"story":"The most serene of the three Gymnopédies — the same slow, hovering dance, its bare melody drifting over rocking chords like something glimpsed through gauze."},
  {"id":"satie-g119","c":"satie","coll":"Gymnopédies","title":"Gymnopédie No. 3","sub":"","key":"A minor","level":3,"year":1888,"dur":3,"story":"The wistful, hymn-like third Gymnopédie — spare and unhurried, radical in 1888 for doing so little, so beautifully."},
  {"id":"satie-g120","c":"satie","coll":"Gnossiennes","title":"Gnossienne No. 2","sub":"","key":"—","level":6,"year":1890,"dur":2,"story":"A hypnotic Gnossienne — barless and modal, it circles a snake-charming melody over a steady vamp, sprinkled with Satie's cryptic performance jokes ('with astonishment,' 'very shiny')."},
  {"id":"satie-g121","c":"satie","coll":"Gnossiennes","title":"Gnossienne No. 3","sub":"","key":"—","level":6,"year":1890,"dur":2.5,"story":"The most famous Gnossienne — an exotic, faintly Eastern melody winds endlessly over a hushed, unchanging accompaniment, timeless and mysterious."},
  {"id":"sat-gnoss4","c":"satie","coll":"Gnossiennes","title":"Gnossienne No. 4","sub":"","key":"—","level":6,"year":1891,"dur":2.5,"story":"Like its siblings, barless and free — a wistful, slightly restless melody drifts over a steady rocking accompaniment. Satie sprinkles the score with his cryptic instructions ('from the tip of the thought,' 'arm yourself with clairvoyance')."},
  {"id":"sat-gnoss5","c":"satie","coll":"Gnossiennes","title":"Gnossienne No. 5","sub":"","key":"—","level":5,"year":1889,"dur":3,"story":"The gentlest of the set and, unusually, in a bright major mood — a flowing, songlike Gnossienne that predates the famous first three. Marked 'souple et expressif.'"},
  {"id":"sat-gnoss6","c":"satie","coll":"Gnossiennes","title":"Gnossienne No. 6","sub":"","key":"—","level":6,"year":1897,"dur":2,"story":"The last Gnossienne, written years after the others — marked 'with conviction and with a rigorous sadness.' Spare and grave, it distils the whole set's hypnotic melancholy."},
  {"id":"satie-g122","c":"satie","title":"Je te veux","sub":"","key":"C major","level":6,"year":1897,"dur":5,"story":"'I want you' — Satie's sweet, swaying café-concert waltz-song, a genuine popular hit written for the singer Paulette Darty."},
  {"id":"satie-g123","c":"satie","title":"Embryons desséchés","sub":"","key":"—","level":6,"year":1913,"dur":4,"story":"'Dried Embryos' — an absurdist musical zoology of imaginary sea creatures, complete with deadpan spoken directions and a quotation of Chopin's funeral march labelled 'a famous mazurka by Schubert.'"},
  {"id":"satie-g124","c":"satie","title":"Sonatine bureaucratique","sub":"","key":"C major","level":5,"year":1917,"dur":4,"story":"A cheeky parody of Clementi's sonatinas — Satie sets it to the tiny drama of a bureaucrat's dull day, humming, taking coffee, and dreaming of promotion."},
  {"id":"satie-g125","c":"satie","title":"Le Piccadilly","sub":"","key":"—","level":6,"year":1904,"dur":2,"story":"A jaunty English-flavored ragtime march — one of Satie's tongue-in-cheek music-hall miniatures, all bounce and swagger."},
  {"id":"sat-berceuse","c":"satie","title":"Berceuse","sub":"Enfantillages pittoresques","key":"C major","level":2,"year":1913,"dur":1.5,"story":"The middle of three 'picturesque childish antics' (1913) — a tiny, deadpan lullaby that carries Satie's whimsical running commentary printed in the score: 'The day over, Pierrot goes to sleep… he has been very good.'"},
  {"id":"clementi-son1-1","c":"clementi","coll":"Sonatina in C, Op. 36 No. 1","title":"Allegro","sub":"I","key":"C major","level":3,"year":1797,"dur":2,"story":"The most famous first sonatina — bright C-major arpeggios almost every student meets early."},
  {"id":"clementi-son1-2","c":"clementi","coll":"Sonatina in C, Op. 36 No. 1","title":"Andante","sub":"II","key":"F major","level":3,"year":1797,"dur":2,"story":"A gentle, songful slow movement."},
  {"id":"clementi-son1-3","c":"clementi","coll":"Sonatina in C, Op. 36 No. 1","title":"Vivace","sub":"III","key":"C major","level":3,"year":1797,"dur":1.5,"story":"A quick, cheerful rondo finale."},
  {"id":"clementi-son3-1","c":"clementi","coll":"Sonatina in C, Op. 36 No. 3","title":"Spiritoso","sub":"I","key":"C major","level":4,"year":1797,"dur":3,"story":"A step up in brilliance, with sparkling scale runs."},
  {"id":"clementi-son5-1","c":"clementi","coll":"Sonatina in G, Op. 36 No. 5","title":"Presto","sub":"I","key":"G major","level":5,"year":1797,"dur":3.5,"story":"One of the showier sonatinas, a favourite recital opener."},
  {"id":"clementi-gradus","c":"clementi","title":"Study in C (from Gradus ad Parnassum)","sub":"Op. 44","key":"C major","level":6,"year":1817,"dur":2,"story":"From the collection of studies that became the piano's technical bible."},
  {"id":"clem-son2-1","c":"clementi","coll":"Sonatina in G, Op. 36 No. 2","title":"Allegretto","sub":"I","key":"G major","level":3,"year":1797,"dur":2,"story":"A bright, tuneful opening in the second sonatina."},
  {"id":"clem-son2-2","c":"clementi","coll":"Sonatina in G, Op. 36 No. 2","title":"Allegretto","sub":"II","key":"C major","level":3,"year":1797,"dur":1.5,"story":"A gentle, songful middle movement."},
  {"id":"clem-son2-3","c":"clementi","coll":"Sonatina in G, Op. 36 No. 2","title":"Allegro","sub":"III","key":"G major","level":3,"year":1797,"dur":1.5,"story":"A lively, skipping finale."},
  {"id":"clem-son3-2","c":"clementi","coll":"Sonatina in C, Op. 36 No. 3","title":"Un poco adagio","sub":"II","key":"F major","level":3,"year":1797,"dur":2,"story":"A tender, cantabile slow movement."},
  {"id":"clem-son3-3","c":"clementi","coll":"Sonatina in C, Op. 36 No. 3","title":"Allegro","sub":"III","key":"C major","level":4,"year":1797,"dur":2,"story":"A cheerful, bustling finale."},
  {"id":"clem-son4-1","c":"clementi","coll":"Sonatina in F, Op. 36 No. 4","title":"Con spirito","sub":"I","key":"F major","level":4,"year":1797,"dur":3,"story":"A spirited, energetic opening — the most ambitious of the six sonatinas."},
  {"id":"clem-son4-2","c":"clementi","coll":"Sonatina in F, Op. 36 No. 4","title":"Andante con espressione","sub":"II","key":"B♭ major","level":3,"year":1797,"dur":2.5,"story":"An expressive, singing slow movement."},
  {"id":"clem-son4-3","c":"clementi","coll":"Sonatina in F, Op. 36 No. 4","title":"Rondo: Allegro vivace","sub":"III","key":"F major","level":4,"year":1797,"dur":2.5,"story":"A brilliant, dashing rondo finale."},
  {"id":"clem-son5-2","c":"clementi","coll":"Sonatina in G, Op. 36 No. 5","title":"Air Suisse: Allegretto moderato","sub":"II","key":"C major","level":3,"year":1797,"dur":2.5,"story":"A charming set of variations on a Swiss air."},
  {"id":"clem-son5-3","c":"clementi","coll":"Sonatina in G, Op. 36 No. 5","title":"Rondo: Allegro di molto","sub":"III","key":"G major","level":4,"year":1797,"dur":2.5,"story":"A fleet, sparkling rondo."},
  {"id":"clem-son6-1","c":"clementi","coll":"Sonatina in D, Op. 36 No. 6","title":"Allegro con spirito","sub":"I","key":"D major","level":4,"year":1797,"dur":3,"story":"A grand, brilliant opening in D major."},
  {"id":"clem-son6-2","c":"clementi","coll":"Sonatina in D, Op. 36 No. 6","title":"Rondo: Allegretto spiritoso","sub":"II","key":"D major","level":4,"year":1797,"dur":3,"story":"A spirited rondo finale rounding off the set."},
  {"id":"bee-elise","c":"beethoven","title":"Für Elise","sub":"WoO 59","key":"A minor","level":4,"year":1810,"dur":3,"story":"Beethoven's best-known bagatelle, a tender rondo found only after his death."},
  {"id":"bee-moon-1","c":"beethoven","coll":"Piano Sonata No. 14 'Moonlight', Op. 27 No. 2","title":"Adagio sostenuto","sub":"I","key":"C♯ minor","level":6,"year":1801,"dur":6,"story":"The hypnotic triplet Adagio Beethoven marked 'like a fantasy'."},
  {"id":"bee-moon-2","c":"beethoven","coll":"Piano Sonata No. 14 'Moonlight', Op. 27 No. 2","title":"Allegretto","sub":"II","key":"D♭ major","level":6,"year":1801,"dur":2,"story":"Liszt called it 'a flower between two chasms'."},
  {"id":"bee-moon-3","c":"beethoven","coll":"Piano Sonata No. 14 'Moonlight', Op. 27 No. 2","title":"Presto agitato","sub":"III","key":"C♯ minor","level":9,"year":1801,"dur":7,"story":"A storm of arpeggios and sforzandos — the real technical test."},
  {"id":"bee-path-1","c":"beethoven","coll":"Piano Sonata No. 8 'Pathétique', Op. 13","title":"Grave – Allegro di molto e con brio","sub":"I","key":"C minor","level":8,"year":1798,"dur":9,"story":"The tragic slow introduction that keeps returning like fate."},
  {"id":"bee-path-2","c":"beethoven","coll":"Piano Sonata No. 8 'Pathétique', Op. 13","title":"Adagio cantabile","sub":"II","key":"A♭ major","level":5,"year":1798,"dur":5,"story":"One of the most beloved slow movements ever written."},
  {"id":"bee-path-3","c":"beethoven","coll":"Piano Sonata No. 8 'Pathétique', Op. 13","title":"Rondo: Allegro","sub":"III","key":"C minor","level":7,"year":1798,"dur":4,"story":"A restless rondo that never quite settles."},
  {"id":"bee-op49-2","c":"beethoven","coll":"Piano Sonata No. 20, Op. 49 No. 2","title":"Allegro ma non troppo","sub":"I","key":"G major","level":4,"year":1796,"dur":4,"story":"A charming 'easy sonata'; its minuet theme reappears in the Septet."},
  {"id":"bee-op49-2-2","c":"beethoven","coll":"Piano Sonata No. 20, Op. 49 No. 2","title":"Tempo di Menuetto","sub":"II","key":"G major","level":4,"year":1796,"dur":3,"story":"A gracious minuet-tempo finale — its lilting theme also opens the famous Septet, Op. 20."},
  {"id":"bee-waldstein-1","c":"beethoven","coll":"Piano Sonata No. 21 'Waldstein', Op. 53","title":"Allegro con brio","sub":"I","key":"C major","level":10,"year":1804,"dur":11,"story":"Pulsing repeated chords launch one of the great virtuoso sonatas."},
  {"id":"bee-waldstein-2","c":"beethoven","coll":"Piano Sonata No. 21 'Waldstein', Op. 53","title":"Introduzione: Adagio molto — Rondo: Allegretto moderato","sub":"II","key":"C major","level":10,"year":1804,"dur":11,"story":"A hushed, suspended Introduzione dissolves into the luminous Rondo, whose gentle theme sings over a shimmering pedal before a dazzling Prestissimo close."},
  {"id":"bee-appass-1","c":"beethoven","coll":"Piano Sonata No. 23 'Appassionata', Op. 57","title":"Allegro assai","sub":"I","key":"F minor","level":10,"year":1805,"dur":10,"story":"Volcanic and tightly wound — Beethoven at his most turbulent."},
  {"id":"bee-appass-2","c":"beethoven","coll":"Piano Sonata No. 23 'Appassionata', Op. 57","title":"Andante con moto","sub":"II","key":"D♭ major","level":9,"year":1805,"dur":6,"story":"A calm, hymn-like theme and variations — an island of serenity between the two storms, leading without a break into the finale."},
  {"id":"bee-appass-3","c":"beethoven","coll":"Piano Sonata No. 23 'Appassionata', Op. 57","title":"Allegro ma non troppo","sub":"III","key":"F minor","level":10,"year":1805,"dur":5,"story":"A relentless, whirling finale that quivers with agitation from first bar to the headlong Presto coda."},
  {"id":"bee-tempest-1","c":"beethoven","coll":"Piano Sonata No. 17 'Tempest', Op. 31 No. 2","title":"Largo – Allegro","sub":"I","key":"D minor","level":8,"year":1802,"dur":8,"story":"Mysterious rolled chords question and answer across the keyboard, erupting into stormy Allegro — the movement that gave the sonata its nickname."},
  {"id":"bee-tempest-2","c":"beethoven","coll":"Piano Sonata No. 17 'Tempest', Op. 31 No. 2","title":"Adagio","sub":"II","key":"B♭ major","level":7,"year":1802,"dur":8,"story":"A spacious, songful Adagio, its drum-like bass figures and hushed spaces full of quiet drama."},
  {"id":"bee-tempest-3","c":"beethoven","coll":"Piano Sonata No. 17 'Tempest', Op. 31 No. 2","title":"Allegretto","sub":"III","key":"D minor","level":8,"year":1802,"dur":7,"story":"A perpetual-motion finale that never lets go."},
  {"id":"bee-op2-1-1","c":"beethoven","coll":"Piano Sonata No. 1, Op. 2 No. 1","title":"Allegro","sub":"I","key":"F minor","level":7,"year":1795,"dur":4,"story":"His first published sonata, dedicated to his teacher Haydn."},
  {"id":"bee-op2-1-2","c":"beethoven","coll":"Piano Sonata No. 1, Op. 2 No. 1","title":"Adagio","sub":"II","key":"F major","level":6,"year":1795,"dur":5,"story":"A songful slow movement borrowed from a boyhood piano quartet — tender and unhurried."},

  {"id":"deb-cc-jimbo","c":"debussy","coll":"Children's Corner","title":"Jimbo's Lullaby","key":"B♭ major","level":4,"year":1908,"dur":3,"story":"The toy elephant lumbers through a sleepy, tender lullaby."},
  {"id":"deb-cc-serenade","c":"debussy","coll":"Children's Corner","title":"Serenade for the Doll","key":"E major","level":5,"year":1908,"dur":2.5,"story":"A delicate, muted serenade for a china doll, all soft staccato."},
  {"id":"deb-cc-shepherd","c":"debussy","coll":"Children's Corner","title":"The Little Shepherd","key":"A major","level":4,"year":1908,"dur":2,"story":"A wistful pastoral tune answering its own playful dance."},
  {"id":"deb-reflets","c":"debussy","coll":"Images, Book 1","title":"Reflets dans l'eau","key":"D♭ major","level":8,"year":1905,"dur":5,"story":"The opening piece of Images, Book 1 (1905) — water reflections rendered in sound, ripples spreading outward from a single dropped chord. Debussy boasted to his publisher Durand that it used 'the newest discoveries in harmonic chemistry,' floating pentatonic and whole-tone washes free of traditional harmony to capture, as he put it, the very movement of water. A descendant of Liszt's fountains at the Villa d'Este, it stands as one of the founding masterpieces of musical Impressionism."},
  {"id":"deb-img1-2","c":"debussy","coll":"Images, Book 1","title":"Hommage à Rameau","sub":"Images, Book 1","key":"—","level":8,"year":1905,"dur":6.5,"story":"A solemn homage to the Baroque master Rameau, cast as a slow sarabande — grave, noble and richly voiced, one of Debussy's most deeply felt pages."},
  {"id":"deb-img1-3","c":"debussy","coll":"Images, Book 1","title":"Mouvement","sub":"Images, Book 1","key":"—","level":9,"year":1905,"dur":4,"story":"A perpetual-motion whirlwind of triplets 'with a fantastical but precise lightness' — glittering, mechanical and dazzling, ending in a burst of C-major brilliance."},
  {"id":"deb-img2-1","c":"debussy","coll":"Images, Book 2","title":"Cloches à travers les feuilles","sub":"Images, Book 2","key":"—","level":8,"year":1907,"dur":4.5,"story":"'Bells through the leaves' — distant bells shimmer through rustling foliage in a haze of whole-tone colour, one of Debussy's most atmospheric soundscapes."},
  {"id":"deb-img2-2","c":"debussy","coll":"Images, Book 2","title":"Et la lune descend sur le temple qui fut","sub":"Images, Book 2","key":"—","level":7,"year":1907,"dur":5,"story":"'And the moon descends on the temple that was' — hushed, exotic and still, floating bare fourths and modal chords evoke a ruined oriental temple under moonlight."},
  {"id":"deb-plp-prelude","c":"debussy","coll":"Pour le piano","title":"Prélude","sub":"Pour le piano","key":"A minor","level":8,"year":1901,"dur":4,"story":"The brilliant opening of Pour le piano — toccata-like drive, whole-tone flurries and a thundering cadenza, blending Baroque energy with modern harmony."},
  {"id":"deb-pre2-1","c":"debussy","coll":"Préludes, Book 2","title":"Brouillards","sub":"Préludes, Book 2","key":"—","level":8,"year":1913,"dur":3,"story":"'Mists' — the two hands play in different keys at once (white against black), blurring the harmony into a soft, drifting fog. Bitonal Impressionism at its most delicate."},
  {"id":"deb-pre2-2","c":"debussy","coll":"Préludes, Book 2","title":"Feuilles mortes","sub":"Préludes, Book 2","key":"—","level":7,"year":1913,"dur":3,"story":"'Dead leaves' — pale, drooping chords fall slowly through a still autumn air, marked 'lent et mélancolique.'"},
  {"id":"deb-pre2-3","c":"debussy","coll":"Préludes, Book 2","title":"La puerta del Vino","sub":"Préludes, Book 2","key":"—","level":8,"year":1913,"dur":3.5,"story":"Inspired by a postcard of a gate in the Alhambra, a sultry habanera swings between 'brusque oppositions of extreme violence and passionate sweetness.'"},
  {"id":"deb-pre2-4","c":"debussy","coll":"Préludes, Book 2","title":"Les fées sont d'exquises danseuses","sub":"Préludes, Book 2","key":"—","level":9,"year":1913,"dur":3,"story":"'The fairies are exquisite dancers' — gossamer, rapid and weightless, a shimmering flutter of wings 'rapide et léger.'"},
  {"id":"deb-pre2-6","c":"debussy","coll":"Préludes, Book 2","title":"Général Lavine – eccentric","sub":"Préludes, Book 2","key":"—","level":7,"year":1913,"dur":2.5,"story":"A cheeky cakewalk portrait of an American clown-puppeteer — jerky, comic and syncopated, 'in the style and movement of a cake-walk.'"},
  {"id":"deb-pre2-7","c":"debussy","coll":"Préludes, Book 2","title":"La terrasse des audiences du clair de lune","sub":"Préludes, Book 2","key":"—","level":8,"year":1913,"dur":4,"story":"'The terrace of moonlight audiences' — hushed and exotic, a slow, perfumed nocturne quoting a snatch of an old French song, bathed in silvery light."},
  {"id":"deb-pre2-8","c":"debussy","coll":"Préludes, Book 2","title":"Ondine","sub":"Préludes, Book 2","key":"—","level":9,"year":1913,"dur":3,"story":"The water-sprite again — capricious and shimmering, 'scherzando,' flickering with watery arabesques and sudden splashes."},
  {"id":"deb-pre2-9","c":"debussy","coll":"Préludes, Book 2","title":"Hommage à S. Pickwick Esq., P.P.M.P.C.","sub":"Préludes, Book 2","key":"—","level":6,"year":1913,"dur":2.5,"story":"A witty tribute to Dickens' Mr. Pickwick — opens with a pompous 'God Save the King' in the bass, then trots along with genial English humour."},
  {"id":"deb-pre2-10","c":"debussy","coll":"Préludes, Book 2","title":"Canope","sub":"Préludes, Book 2","key":"—","level":6,"year":1913,"dur":3,"story":"Named for an Egyptian funerary urn on Debussy's desk — grave, still and archaic, spare modal chords evoking a distant, timeless antiquity."},
  {"id":"deb-pre2-11","c":"debussy","coll":"Préludes, Book 2","title":"Les tierces alternées","sub":"Préludes, Book 2","key":"—","level":9,"year":1913,"dur":3.5,"story":"'Alternating thirds' — a glittering moto perpetuo of thirds tossed between the hands, a study in sparkle that looks ahead to the Études."},
  {"id":"deb-poissons","c":"debussy","coll":"Images, Book 2","title":"Poissons d'or","key":"F♯ major","level":9,"year":1907,"dur":4,"story":"'Goldfish' darting in glittering figuration, inspired by a Japanese lacquer panel."},
  {"id":"deb-feux","c":"debussy","coll":"Préludes, Book 2","title":"Feux d'artifice","key":"D♭ major","level":11,"year":1913,"dur":5,"story":"Bastille-Day fireworks over Paris, closing Book II with a distant Marseillaise."},

/* ================================================================
   Warm-up (pre-practice scales) generator — 練習音階
   ================================================================ */
const REL_MINOR = { "C":"A","G":"E","D":"B","A":"F♯","E":"C♯","B":"G♯","F":"D","B♭":"G","E♭":"C","A♭":"F","D♭":"B♭","G♭":"E♭","F♯":"D♯" };
const REL_MAJOR = { "A":"C","E":"G","B":"D","F♯":"A","C♯":"E","G♯":"B","D":"F","G":"B♭","C":"E♭","F":"A♭","B♭":"D♭","E♭":"G♭" };
function warmupFor(p) {
  const tonic = p.key.replace(/ (major|minor)/i, "").trim();
  const mode = modeOf(p);
  const rel = mode === "major" ? (REL_MINOR[tonic] || "the relative minor") : (REL_MAJOR[tonic] || "the relative major");
  const relLabel = mode === "major" ? `${rel} harmonic minor` : `${rel} major`;
  return [
    `<b>${tonic} ${mode} scale</b> — 2 octaves, hands together, slow and even. This is the home key of the piece.`,
    `<b>${tonic} ${mode} arpeggio</b> — 2 octaves up and down; keep the thumb-under smooth.`,
    `<b>${relLabel} scale</b> — the closely-related key you'll touch in the middle section.`,
    `<b>${tonic} ${mode} scale</b> — 2 octaves, hands together, slow and even. This is the home key of the piece.`,
    `<b>${tonic} ${mode} arpeggio</b> — 2 octaves up and down; keep the thumb-under smooth.`,
    `<b>${relLabel} scale</b> — the closely-related key you'll touch in the middle section.`,
    `<b>Chromatic scale from ${tonic}</b> — light fingers, steady pulse, to loosen the hand before playing.`,
  ];
}

// semitone value of each natural letter, for chromatic spelling
const LETTER_SEMI = { "C":0,"D":2,"E":4,"F":5,"G":7,"A":9,"B":11 };
const CHROM_SHARP = [["C",0],["C",1],["D",0],["D",1],["E",0],["F",0],["F",1],["G",0],["G",1],["A",0],["A",1],["B",0]];

function fifthsFor(tonic, mode){ return (mode==="minor"?MINOR_FIFTHS:MAJOR_FIFTHS)[tonic] ?? 0; }
function alterForLetter(letter, fifths){
  if (fifths>0 && SHARP_ORDER.slice(0,fifths).includes(letter)) return 1;
  if (fifths<0 && FLAT_ORDER.slice(0,-fifths).includes(letter)) return -1;
  return 0;
}
// build ascending+descending diatonic scale, one octave, as [{step,alter,octave}]
function scaleNotes(tonic, fifths){
  const start = LETTERS.indexOf(tonic[0]);
  const up = [];
  let oct = 4;
  for (let i=0;i<=7;i++){
    const li = (start+i)%7;
    if (i>0 && li===0) oct++;               // wrapped past B -> C, next octave
    const letter = LETTERS[li];
    up.push({ step:letter, alter:alterForLetter(letter,fifths), octave:oct });
  }
  const down = up.slice(0,7).reverse();
  return up.concat(down);
}
function arpeggioNotes(tonic, fifths){
  const s = scaleNotes(tonic, fifths);
  const idx = [0,2,4,7];                      // 1-3-5-8
  const up = idx.map(i=>s[i]);
  return up.concat(up.slice(0,3).reverse());
}
function chromaticNotes(tonic){
  const startPc = (LETTER_SEMI[tonic[0]] + (tonic.includes("♯")?1:tonic.includes("♭")?-1:0) + 12) % 12;
  const notes = []; let oct = 4;
  for (let i=0;i<=12;i++){
    const pc = (startPc+i)%12;
    if (i>0 && pc===0) oct++;
    const [step,alter] = CHROM_SHARP[pc];
    notes.push({ step, alter, octave:oct });
  }
  return notes;
}
function noteXML(n){
  return `<note><pitch><step>${n.step}</step>${n.alter?`<alter>${n.alter}</alter>`:""}<octave>${n.octave}</octave></pitch><duration>1</duration><type>eighth</type></note>`;
}
function restXML(){ return `<note><rest/><duration>1</duration><type>eighth</type></note>`; }
function exerciseXML(notes, fifths){
  // 8 eighth-notes (4/4) per measure, pad the last measure with rests
  const measures = [];
  for (let i=0;i<notes.length;i+=8){
    let body = notes.slice(i,i+8).map(noteXML).join("");
    const pad = 8 - Math.min(8, notes.length-i);
    for (let r=0;r<pad;r++) body += restXML();
    const attrs = i===0 ? `<attributes><divisions>2</divisions><key><fifths>${fifths}</fifths></key><time><beats>4</beats><beat-type>4</beat-type></time><clef><sign>G</sign><line>2</line></clef></attributes>` : "";
    measures.push(`<measure number="${measures.length+1}">${attrs}${body}</measure>`);
  }
  return `<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE score-partwise PUBLIC "-//Recordare//DTD MusicXML 3.1 Partwise//EN" "http://www.musicxml.org/dtds/partwise.dtd"><score-partwise version="3.1"><part-list><score-part id="P1"><part-name></part-name></score-part></part-list><part id="P1">${measures.join("")}</part></score-partwise>`;
}
function exercisesFor(p){
  const tonic = p.key.replace(/ (major|minor)/i,"").trim();
  const mode = modeOf(p);
  const fifths = fifthsFor(tonic, mode);
  return [
    { label:`${tonic} ${mode} scale`, hint:"2 octaves feel — slow & even, hands together", xml:exerciseXML(scaleNotes(tonic,fifths),fifths) },
    { label:`${tonic} ${mode} arpeggio`, hint:"1-3-5-8 up & down, smooth thumb-under", xml:exerciseXML(arpeggioNotes(tonic,fifths),fifths) },
    { label:`Chromatic from ${tonic}`, hint:"light fingers, steady pulse", xml:exerciseXML(chromaticNotes(tonic),0) },
  ];
}
// ---- Warm-up: real public-domain exercise scores, matched to the piece's key + level ----
// Scale (Hanon, all 24 keys) always; + one technique matched to the piece (only for level > WARMUP_EASY_MAX).
const WARMUP_SCALE_KEYS = new Set(["C major","G major","D major","A major","E major","B major","F♯ major","G♭ major","D♭ major","C♯ major","A♭ major","E♭ major","B♭ major","F major","A minor","E minor","B minor","F♯ minor","C♯ minor","G♯ minor","E♭ minor","B♭ minor","F minor","C minor","G minor","D minor"]);
const WARMUP_ENHARM = { "F♯ major":"G♭ major", "C♯ major":"D♭ major" };   // no own Hanon page — reuse the twin
const wslug = k => k.toLowerCase().replace(/♭/g,"b").replace(/♯/g,"s").replace(/ /g,"-");
function scaleImg(key){ return WARMUP_SCALE_KEYS.has(key) ? "warmup-scale-"+wslug(WARMUP_ENHARM[key]||key) : null; }
function arpImg(key){ return WARMUP_SCALE_KEYS.has(key) ? "warmup-arp-"+wslug(WARMUP_ENHARM[key]||key) : null; }
// 2nd technique: default = arpeggio (Hanon, all keys); override per piece to "velocity"/"none".
const WARMUP_CZERNY = { "G major":{ sub:"Czerny · School of Velocity, Op. 299 No. 16", imgs:["warmup-czerny-g"] } };
const WARMUP_EASY_MAX = 5;   // level <= this => Scale only
const WARMUP_TECH = {};      // per-piece override, e.g. {"liszt-x":"velocity","bach-y":"none"}
function warmupItems(p){
  const it = [];
  const sc = scaleImg(p.key);
  if (sc) it.push({ id:"scale", label:"Scale", title:`${fmtKey(p.key)} scale`, sub:"Hanon · Two octaves, hands together", imgs:[sc] });
  if (p.level > WARMUP_EASY_MAX) {
    const tech = WARMUP_TECH[p.id] || "arpeggio";
    const a = arpImg(p.key);
    if (tech === "arpeggio" && a) it.push({ id:"arp", label:"Arpeggio", title:`${fmtKey(p.key)} arpeggio`, sub:"Hanon · 1·3·5·8, smooth thumb-under", imgs:[a] });
    else if (tech === "velocity" && WARMUP_CZERNY[p.key]) it.push({ id:"vel", label:"Velocity", title:`${fmtKey(p.key)} velocity`, sub:WARMUP_CZERNY[p.key].sub, imgs:WARMUP_CZERNY[p.key].imgs });
  }
  return it.slice(0, 2);
}

  let cur = Math.min(sheetCtx.warmup||0, items.length-1);

    cur = i; sheetCtx.warmup = i; const it = items[i];

  // enlarge = same fit-to-page overlay as Music (single page, so no paging); panel auto-hides
  let panelTimer = null;

  });
  wirePinchZoom(fv, scroll);

}
// render a MusicXML string into host via OSMD (consistent staff/notes)
async function renderNotation(host, xml){
  if (!window.opensheetmusicdisplay){ host.innerHTML = `<div class="score-note">Notation engine not loaded</div>`; return; }
  // prominent loading state while OSMD parses + lays out (renders into a separate inner div)
  host.innerHTML = `<div class="score-loading">Loading score<span class="ld"><i></i><i></i><i></i></span></div><div class="osmd-inner"></div>`;
  const inner = host.querySelector(".osmd-inner");
  const clearLoading = ()=>{ const l = host.querySelector(".score-loading"); if (l) l.remove(); };
  try {
    await new Promise(r=>requestAnimationFrame(r));   // let the loading state paint first
    const FIXED_W = 800;   // render at a FIXED width → identical line-breaks/pages on every device
    inner.style.width = FIXED_W + "px";
    inner.style.transformOrigin = "top left";
    const osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay(inner, {
      autoResize:true, drawTitle:false, drawSubtitle:false, drawPartNames:false,
      drawingParameters:"default", drawMeasureNumbers:true, measureNumberInterval:1,
      pageFormat:"A4_P", pageBackgroundColor:"#FFFFFF"
    });
    try {   // don't let OSMD draw its own title/composer (the hero already shows them); modest spacing
      const R = osmd.EngravingRules || osmd.rules;
      if (R) { R.RenderComposer = false; R.RenderTitle = false; R.RenderSubtitle = false; R.RenderLyricist = false; R.RenderPartNames = false;
        R.MinimumDistanceBetweenSystems = 8; R.PageTopMargin = 12; R.PageBottomMargin = 6; }
    } catch(e){}
    // Device-independent engraving: a wide page (in OSMD units) → small notes + more measures/row.
    // OSMD auto-breaks before a row would be cut → no crop, no stretch gaps. Same pages on every screen.
    const PAGE_W = 440;   // page width in units — larger = smaller notes / more measures per row
    const ROWS   = 5;     // target rows per page (OSMD auto-fits 4-5 depending on row heights)
    const pxPerUnit = FIXED_W / PAGE_W;
    const R2 = osmd.EngravingRules || osmd.rules;
    const topM = (R2 && R2.PageTopMargin) || 12, botM = (R2 && R2.PageBottomMargin) || 6;
    await osmd.load(xml);
    osmd.zoom = 1;
    try {
      osmd.setCustomPageFormat(PAGE_W, 4000);    // measuring pass: one tall page so all rows stack
      osmd.render();
      let d = 60;                                // median row height (units)
      try {
        const p0 = osmd.graphic.musicPages[0];
        const ss = p0 && (p0.musicSystems || p0.MusicSystems) || [];
        const gaps = [];
        for (let i = 1; i < ss.length; i++) { const g = ss[i].boundingBox.absolutePosition.y - ss[i-1].boundingBox.absolutePosition.y; if (g > 0) gaps.push(g); }
        if (gaps.length) { gaps.sort((a,b)=>a-b); d = gaps[Math.floor(gaps.length/2)]; }
      } catch(e){}
      const H = Math.round(topM + botM + d * ROWS);   // fixed page height ~ROWS rows; OSMD auto-breaks (no crop)
      osmd.setCustomPageFormat(PAGE_W, H);
      osmd.render();                             // final paginated render (layout now frozen)
    } catch(e){ try { osmd.render(); } catch(_){} }
    clearLoading();
    // CSS-scale the fixed-width render to fit the container (layout never changes, only the scale)
    const fit = ()=>{
      const cw = host.clientWidth; if (cw <= 0) return;
      const scale = Math.min(1.6, cw / FIXED_W);
      inner.style.transform = `scale(${scale})`;
      host.style.height = (inner.offsetHeight * scale) + "px";
      const svgs = [...inner.querySelectorAll("svg")];   // each A4 page = one svg
      const pageTops = svgs.map(s => s.offsetTop * scale);
      host._pageTops = pageTops;
      // each staff-row (system) top, in scaled px from the host origin → up/down never cuts a line
      try {
        const sys = [];
        (osmd.graphic && osmd.graphic.musicPages || []).forEach((pg, pi) => {
          const base = pageTops[pi] || 0;
          (pg.musicSystems || pg.MusicSystems || []).forEach(ms => {
            const y = ms && ms.boundingBox && ms.boundingBox.absolutePosition && ms.boundingBox.absolutePosition.y;
            if (y != null) sys.push(base + y * pxPerUnit * scale);   // units → render px
          });
        });
        host._sysTops = sys.length ? sys.sort((a,b)=>a-b) : null;
      } catch(e){ host._sysTops = null; }
    };
    fit();
    requestAnimationFrame(fit);
    if (window.ResizeObserver) {
      let lastW = 0;
      new ResizeObserver(()=>{ const w = host.clientWidth; if (w > 0 && Math.abs(w - lastW) > 2) { lastW = w; fit(); } }).observe(host.parentElement || host);
    }
  } catch(e){ host.innerHTML = `<div class="score-note">Couldn't render notation</div>`; }
}

/* difficulty label */
function levelLabel(l) {
  if (l <= 3) return t("Intermediate");
  if (l <= 6) return t("Advanced");
  if (l <= 8) return t("Early-virtuoso");
  return t("Virtuoso");
}

let rootTab = "home";
function stopSpotify(){ document.querySelectorAll(".spotify-embed iframe").forEach(f=>{ try{ f.src = "about:blank"; }catch(e){} }); }
function show(view, root, hash) {
  const apply = () => {
    if (view !== "sheet") stopSpotify();   // leaving a piece → kill any Spotify preview
    document.querySelectorAll(".view").forEach(v => { v.classList.remove("is-active"); v.classList.remove("show-title"); });
    const el = document.getElementById("view-" + view);
    el.classList.add("is-active");
    document.getElementById("screen").scrollTop = 0;
    document.body.classList.remove("fs-active");   // clear enlarge overlay on navigate
    const tb = document.getElementById("tabbar");
    if (tb) { tb.style.display = (view === "sheet") ? "none" : ""; tb.classList.remove("nav-hidden"); }   // focused reading view + reveal nav
    requestAnimationFrame(refreshSticky);   // position the sticky sort bar under the (now-visible) top bar
    if (root) {
      rootTab = root;
      document.querySelectorAll(".tabbtn").forEach(b => b.classList.toggle("is-active", b.dataset.tab === root));
    }
  };
  // smooth crossfade between pages where supported; instant otherwise
  if (document.startViewTransition) document.startViewTransition(apply);
  else apply();
  if (hash !== null) setHash(hash === undefined ? view : hash);
}

let suppressRoute = false;
function setHash(h) {
  if ("#" + h === location.hash) return;
  suppressRoute = true;
  location.hash = h;
}
function routeTo(hash) {
  const [seg, arg] = (hash || "").replace(/^#\/?/, "").split("/");

  else if (seg === "piece" && pieceById(arg)) openSheet(arg);
  else if (seg === "library") { renderLibrary(); show("library","library"); }
  else if (seg === "saved") { renderSaved(); show("saved","saved"); }
  else if (seg === "setting" && arg) { openSetting(arg); }
  else if (seg === "profile") { renderProfile(); show("profile","profile"); }
  else { renderHome(); show("home","home"); }
}
window.addEventListener("hashchange", () => {
  if (suppressRoute) { suppressRoute = false; return; }
  routeTo(location.hash);
});

  const b = e.target.closest(".tabbtn"); if (!b) return;
  const t = b.dataset.tab;

  else if (t === "library") { renderLibrary(); show("library","library"); }

});

/* score preview — decorative grand-staff SVG */
function scoreSVG() {
  const line = y => `<line x1="20" x2="612" y1="${y}" y2="${y}" stroke="#c9c9cf" stroke-width="1"/>`;
  let s = "";
  for (let i=0;i<5;i++) s += line(24 + i*11);        // treble
  for (let i=0;i<5;i++) s += line(104 + i*11);       // bass
  // note heads scattered
  const notes = [90,130,170,210,250,290,330,370,410,450,490,530,570];
  let heads = "";
  notes.forEach((x,i) => {
    const y = 24 + ((i*7)%5)*11 + (i%2?5:0);
    heads += `<ellipse cx="${x}" cy="${y}" rx="6" ry="4.5" fill="#3a3a40" transform="rotate(-18 ${x} ${y})"/><line x1="${x+5.5}" x2="${x+5.5}" y1="${y}" y2="${y-30}" stroke="#3a3a40" stroke-width="1.4"/>`;
    const y2 = 104 + ((i*4)%5)*11;
    heads += `<ellipse cx="${x}" cy="${y2}" rx="6" ry="4.5" fill="#8a8a92" transform="rotate(-18 ${x} ${y2})"/>`;
  });
  return `<svg viewBox="0 0 632 168" xmlns="http://www.w3.org/2000/svg">
    <text x="26" y="60" font-size="62" fill="#3a3a40" font-family="Georgia, serif">𝄞</text>
    <text x="26" y="128" font-size="46" fill="#8a8a92" font-family="Georgia, serif">𝄢</text>
    ${s}${heads}
    <line x1="611" x2="611" y1="24" y2="148" stroke="#c9c9cf" stroke-width="2"/>
  </svg>`;
}

/* progress ring svg */
function ringSVG(pct) {
  const r = 26, c = 2*Math.PI*r, off = c*(1 - pct/100);
  return `<svg class="ring" viewBox="0 0 62 62">
    <circle cx="31" cy="31" r="${r}" fill="none" stroke="var(--mu-gray-200)" stroke-width="6"/>
    <circle cx="31" cy="31" r="${r}" fill="none" stroke="var(--mu-gray-900)" stroke-width="6"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 31 31)"/>
    <text x="31" y="36" text-anchor="middle">${pct}%</text>
  </svg>`;
}

/* --- piece naming: compose the concert-standard form from coll + title --- */
function romanize(n){const t=[["X",10],["IX",9],["V",5],["IV",4],["I",1]];let r="";for(const[s,v]of t)while(n>=v){r+=s;n-=v;}return r;}
function catFix(s){return s.replace(/\b([A-Za-z]{1,3})\.(?=\d)/g,"$1. ");} // M.68 → M. 68, K.545 → K. 545
const ROMSUB={I:1,II:2,III:3,IV:4,V:5,VI:6,VII:7,VIII:8};
function movRoman(p){return ROMSUB[(p.sub||"").trim()]||0;}
function movNo(p){const r=movRoman(p);if(r)return r;const m=(p.sub||"").match(/No\.\s*(\d+)|\/(\d+)/);return m?+(m[1]||m[2]):0;}
/* multi-movement works (played as one piece) number movements in roman, like record labels;
   numbered collections of standalone pieces keep "No. N" */
const MV_WORKS=/^(Sonatine|Le tombeau de Couperin|Gaspard de la nuit|Miroirs|Valses nobles)/;
function movPrefix(p){const n=movNo(p);if(!n)return "";return (movRoman(p)||MV_WORKS.test(p.coll||""))?romanize(n)+".":"No. "+n;}
function isMovement(p){return !!p.coll && movNo(p)>0;}
// short form for rows already grouped under their work header, e.g. "I. Prélude"
function movementLabel(p){const pre=movPrefix(p),mv=isMovement(p);p=locPiece(p);if(!mv)return p.title;return pre.startsWith("No.")?`${pre} · ${p.title}`:`${pre} ${p.title}`;}
// full concert form, e.g. "Le tombeau de Couperin, M. 68: I. Prélude"
function pieceFullName(p){const pre=movPrefix(p);p=locPiece(p);
  if(isMovement(p)) return `${catFix(p.coll)}: ${pre} ${p.title}`;
  if(p.coll && p.coll!==p.title) return `${catFix(p.coll)}: ${p.title}`;
  if(p.sub && /^[A-Za-z]{1,4}\.?\s*\d/.test(p.sub) && !/·|No\./.test(p.sub)) return `${p.title}, ${catFix(p.sub)}`;
  return p.title;
}
// HTML forms that grey the catalogue + movement number for easier reading
function splitColl(coll){const m=coll.match(/^(.*?),\s*([A-Za-z]{0,4}\.?\s*\d.*)$/);return m?[m[1],catFix(m[2])]:[coll,""];}
function _dim(s){return `<span class="pn-dim">${s}</span>`;}
function pieceNameHTML(p){
  const pre=movPrefix(p);
  p=locPiece(p);
  if(isMovement(p)){const[w,cat]=splitColl(p.coll);return `${w}${cat?`, ${cat}`:""} • ${_dim(`${pre.startsWith("No.")?pre+",":pre} ${p.title}`)}`;}
  if(p.coll && p.coll!==p.title){const[w,cat]=splitColl(p.coll);return `${w}${cat?`, ${cat}`:""} • ${_dim(p.title)}`;}
  if(p.sub && /^[A-Za-z]{1,4}\.?\s*\d/.test(p.sub) && !/·|No\./.test(p.sub)) return `${p.title}, ${catFix(p.sub)}`;
  return p.title;
}
function movementLabelHTML(p){const pre=movPrefix(p),mv=isMovement(p);p=locPiece(p);if(!mv)return p.title;return `${_dim(pre)} ${p.title}`;}
// plain work + catalogue, e.g. "Le tombeau de Couperin, M. 68" ("" if standalone with no catalogue)
function pieceWorkLine(p){
  p=locPiece(p);
  if(p.coll){const[w,cat]=splitColl(p.coll);return `${w}${cat?`, ${cat}`:""}`;}
  if(p.sub && /^[A-Za-z]{1,4}\.?\s*\d/.test(p.sub) && !/·|No\./.test(p.sub)) return catFix(p.sub);
  return "";
}
// concert form with weight (not colour) distinction: work 400, movement 600
function pieceNameWeightHTML(p){
  const pre=movPrefix(p);
  p=locPiece(p);
  if(isMovement(p)){const[w,cat]=splitColl(p.coll);return `<span class="pn-work">${w}${cat?`, ${cat}`:""}: </span><span class="pn-mov">${pre.startsWith("No.")?pre+",":pre} ${p.title}</span>`;}
  if(p.coll && p.coll!==p.title){const[w,cat]=splitColl(p.coll);return `<span class="pn-work">${w}${cat?`, ${cat}`:""}: </span><span class="pn-mov">${p.title}</span>`;}
  if(p.sub && /^[A-Za-z]{1,4}\.?\s*\d/.test(p.sub) && !/·|No\./.test(p.sub)) return `<span class="pn-mov">${p.title}</span><span class="pn-work">, ${catFix(p.sub)}</span>`;

}

/* ---- forgiving search: case/diacritic/punctuation-insensitive; "op28"/"op 28" match
   "Op. 28"; roman numerals match digits (typing "2" finds "II"); localized titles and
   composer names match too. Every word of the query must appear somewhere. ---- */
const _ROM2NUM = {i:"1",ii:"2",iii:"3",iv:"4",v:"5",vi:"6",vii:"7",viii:"8",ix:"9",x:"10",xi:"11",xii:"12"};
function searchNorm(s){
  s = (s||"").toLowerCase();
  try { s = s.normalize("NFD").replace(/[\u0300-\u036f]/g,""); } catch(e){}
  return s.replace(/\u266d/g,"b").replace(/\u266f/g,"#")
    .replace(/[.,:;\u00b7'\u2019"\u201e\u201c\u201d()\[\]\-\u2013\u2014\/]/g," ")
    .replace(/\b(xii|xi|x|ix|viii|vii|vi|v|iv|iii|ii|i)\b/g, m=>_ROM2NUM[m])
    .replace(/([a-z])(\d)/g,"$1 $2").replace(/(\d)([a-z])/g,"$1 $2")
    .replace(/\s+/g," ").trim();
}
const _hayCache = {};
function searchHay(p){
  const ck = p.id + "|" + S.lang;
  if (_hayCache[ck]) return _hayCache[ck];
  const l = locPiece(p);
  const hay = searchNorm([p.title, p.sub, p.coll, l.title, l.sub, l.coll, p.key,
    COMPOSERS[p.c] && COMPOSERS[p.c].name, cName(p.c)].filter(Boolean).join(" "));
  return (_hayCache[ck] = hay);
}
function searchMatch(p, q){
  const toks = searchNorm(q).split(" ");
  if (!toks.length || !toks[0]) return false;
  const hay = searchHay(p);
  return toks.every(tk => hay.includes(tk));
}

function renderSearchResults(q) {
  const ql = q.toLowerCase();
  const pcs = PIECES.filter(p => searchMatch(p, q));
  const comps = Object.keys(COMPOSERS).filter(id => COMPOSERS[id].name.toLowerCase().includes(ql));
  if (!pcs.length && !comps.length)
    return `<div class="empty"><div class="empty-title">No matches for "${q}"</div>
      <div class="empty-sub">Try a composer, a key like "minor", or a piece name.</div></div>`;
  let html = "";
  if (comps.length) html += `<div class="sec"><div class="grouphead">${t("Composers")}</div><div class="cgrid" style="margin-top:10px">${comps.map(composerCard).join("")}</div></div>`;
  if (pcs.length) html += `<div class="sec"><div class="grouphead">${t("Pieces")} · ${pcs.length}</div><div class="rowlist">${pcs.map((p,i)=>pieceRow(p,i)).join("")}</div></div>`;
  return html;
}

function todayCalendar() {
  const now = new Date();
  const md = `${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;
  const dateLabel = now.toLocaleString("en-US",{month:"short",day:"numeric"});
  const events = CALENDAR.filter(c => c.md === md);
  return { dateLabel, events: events.length ? events : [{ composer:null, year:"", title:"A quiet day", text:"No milestone today — a clear page for your own practice." }] };
}

// shared: sort a piece list into labelled groups by sort key
function groupPieces(list, sort) {
  if (sort === "dateAdded") return [["", list]];   // list is already in saved order (newest first)
  if (sort === "key") {
    list.sort((a,b)=>a.key.localeCompare(b.key));
    const maj = list.filter(p=>modeOf(p)==="major"), min = list.filter(p=>modeOf(p)==="minor");
    return [["Major keys", maj],["Minor keys", min]].filter(([,a])=>a.length);
  }
  if (sort === "coll") {
    const colls = {};
    list.forEach(p => { const k = p.coll || "Standalone pieces"; (colls[k] = colls[k] || []).push(p); });
    return Object.entries(colls).sort((a,b)=>{
      if (a[0]==="Standalone pieces") return 1; if (b[0]==="Standalone pieces") return -1;
      return b[1].length - a[1].length;
    });
  }
  if (sort === "composer") {
    const by = {};
    list.forEach(p => { (by[p.c] = by[p.c] || []).push(p); });
    Object.values(by).forEach(arr => arr.sort((a,b)=>pieceFullName(a).localeCompare(pieceFullName(b),undefined,{numeric:true})));
    return Object.keys(by).sort((a,b)=>cName(a).localeCompare(cName(b))).map(cid=>[cName(cid), by[cid]]);
  }
  if (sort === "year") list.sort((a,b)=>a.year-b.year);
  else if (sort === "length") list.sort((a,b)=>a.dur-b.dur);
  else if (sort === "level") {
    // sort by the chosen board's grade; pieces that board doesn't list sink to a group at the bottom
    const gnum = p => { const v = String(gradeVal(p.level, S.gradeSystem||"mtac", p.id)||""); return v ? parseFloat(v.replace("~","").replace("+",".5")) : null; };
    const graded = list.filter(p=>gnum(p)!=null).sort((a,b)=>(gnum(a)-gnum(b))||(a.level-b.level));
    const rest = list.filter(p=>gnum(p)==null).sort((a,b)=>a.level-b.level);
    return rest.length ? [["", graded],[t("Not on this syllabus"), rest]] : [["", graded]];
  }
  else list.sort((a,b)=>pieceFullName(a).localeCompare(pieceFullName(b),undefined,{numeric:true})); // name (default, natural: No. 2 < No. 10)
  return [["", list]];
}
// shared: render labelled groups into a wrap, honouring sort field + direction
function renderGroups(wrap, groups, sort, dir) {
  wrap.innerHTML = groups.map(([label, arr]) => {
    const rows = dir === "desc" ? arr.slice().reverse() : arr;
    return `${label ? `<div class="grouphead">${label} · ${arr.length}</div>` : ""}<div class="rowlist">${rows.map((p,i)=>pieceRowWithSort(p,i,sort)).join("")}</div>`;
  }).join("");

}
// shared: the Sort button + field chips + search bar markup
function sortBarHTML(state, searchId, labels) {
  labels = labels || SORT_LABELS;
  return `<button class="sort-lead" data-role="dir" data-dir="${state.dir}" title="Ascending / descending" aria-label="Sort direction"><svg width="22" height="18" viewBox="0 0 20 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path class="sd-up" d="M5 12V2M2.5 4.5L5 2l2.5 2.5"/><path class="sd-dn" d="M13 4v10M10.5 11.5L13 14l2.5-2.5"/></svg><span class="sort-lead-txt">${state.dir==="desc"?t("Desc"):t("Asc")}</span></button>
      <span class="sort-divider"></span>

      ${Object.entries(labels).map(([k,l])=>`<button data-sort="${k}" class="${k===state.sort?'is-active':''}">${t(l)}</button>`).join("")}
      <div class="dropdown sort-dd">
